<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marquee — Overlay Output</title>
<style>
  /* Layout/visuals CSS started as a copy of the original static render page
     but has since diverged (stage border made inset, backdrop-filter removed,
     confetti-canvas + fade rules added) — see the comments on those rules below
     for why. This page differs from that source both in content delivery
     (live WS push vs. baked-in text) and in these CSS fixes. */
  :root {
    font-size: 18px;
    --void: #16110d;
    --void-2: #1d1712;
    --curtain: #3a1518;
    --gold: #e8a33d;
    --bulb-hot: #ffd37a;
    --paper: #f3e9d8;
    --paper-dim: #b8a88c;
    /* Text Color control's own var — see editor.html's identical :root
       comment (mirrored here). Only the rendered content text
       (.title/.stat-value/.custom-text) reads this instead of --paper. */
    --text-color: #f3e9d8;

    --accent: #ff8200;
    --accent-rgb: 255 130 0;
    --chip-rgb: 0 0 0;
    --chip-alpha: 0;
    --canvas-bg-rgb: 0 0 0;
    --canvas-bg-alpha: 0;
    --element-head-size: 10px;
    --border-width: 1px;
    --edge-rounding: 0px;
    /* Marquee Bulbs' own size/gap live in visuals.marqueeBulbSize/
       marqueeBulbGap (plain JS state, read directly by setBulbLoop())
       rather than a CSS custom property — its dash pattern has to divide
       the element's actual current perimeter evenly, which only JS can
       compute, so there's nothing for a CSS var to drive here. */
    /* Album Art is the one element positioned via a CSS transform:scale()
       on itself (see the `if ('scale' in pos)` branch below) rather than
       plain width/height — since a transform magnifies every descendant
       uniformly, its bulb ring would otherwise render `scale`x bigger
       than the same configured Bulb Size/Gap everywhere else. --art-scale
       defaults to 1 (a no-op) and is overridden only on #obj-art itself,
       right alongside where its transform is set; setBulbLoop() reads it
       straight off the element and divides it back out, so the
       correction stays in sync with live resizing without any CSS
       involved. */
    --art-scale: 1;
    --marquee-star-size: 10px;
    --marquee-bulb-flicker-intensity: 0.6;
    --content-width: min(1200px, 94vw);
    --stage-w-px: 520px;
    --stage-ratio: 520 / 200;

    --font-display: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Consolas', 'SFMono-Regular', Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    color: var(--paper);
    font-family: var(--font-body);
    padding: clamp(20px, 4vw, 56px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .stage {
    position: relative;
    width: min(var(--stage-w-px), 94vw);
    aspect-ratio: var(--stage-ratio);
    border-radius: var(--edge-rounding);
    overflow: hidden;
    background: transparent;
    /* Drop shadow only now — the layout-wide border ring moved to
       .stage::after below (see its own comment for why: box-shadow/
       border on .stage ITSELF paints as part of .stage's own box
       decoration, which happens BEFORE any of .stage's children paint —
       so any element sitting flush against the canvas edge (full-bleed
       Album Art, a full-width Marquee Roll/banner, ...) painted directly
       over the ring wherever they overlapped it. Reported live: the
       ring didn't show at all in a real OBS output, because the active
       layout had element(s) covering it basically all the way around.
       This exact "children paint over my own border" problem is why
       .obj::after exists for individual elements (see its own comment)
       — .stage needed the identical fix, just at the canvas level
       instead of the per-element one. This box-shadow's own inset-vs-
       outset history (it used to double as the border ring too, drawn
       inset so it wouldn't get clipped by the stage having zero space
       outside it) is moot now that the border isn't here at all. */
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.8);
    /* Whole-overlay fade, driven by JS toggling .stage-visible based on
       state.song (or an active editor preview) — see updateVisibility()
       below. Starts invisible: nothing should show before we've heard
       from the backend at all, matching "invisible when no song is
       playing" as the default rather than a brief flash of the last
       static build's placeholder-ish look. --fade-seconds comes from
       visuals.fadeSeconds (editor-configurable, default 5s).
       Fade OUT (this rule — the class getting REMOVED transitions
       toward whatever THIS selector says): reads as "stays fully
       visible, then disappears in one quick beat at the very end,"
       not "gradually gets dimmer for the whole configured duration."
       transition-delay holds the current (visible) opacity in place for
       (--fade-seconds minus 1s), THEN the 1s duration ramps it down —
       so no matter how long --fade-seconds is (5s, 10s, whatever), the
       actual visible ramp is always the last 1 second of it.
       min(1s, ...) on the duration and max(..., 0s) on the delay both
       exist for the same reason: a --fade-seconds shorter than 1s (or
       0s outright, e.g. the "USER" preset's all-off default) has less
       than a full second to work with at all — clamping both keeps a
       sub-1s or zero setting fading over its own real length (or not
       fading at all at 0s) instead of a flat 1s ramp ignoring what was
       actually configured. */
    opacity: 0;
    transition: opacity min(1s, var(--fade-seconds, 5s)) ease-in max(calc(var(--fade-seconds, 5s) - 1s), 0s);
  }
  .stage.stage-visible {
    opacity: 1;
    /* Fade IN: a decelerating curve instead of linear — reads as
       "already most of the way there almost immediately, then eases
       into fully settled" rather than a uniform ramp the whole way.
       Duration is the full --fade-seconds here (unlike fade-out above,
       there's no "only the last second" ask for this direction). */
    transition: opacity var(--fade-seconds, 5s) cubic-bezier(0.05, 0.7, 0.1, 1);
  }
  /* The layout-wide border ring, as a ::after pseudo-element instead of a
     box-shadow/border property on .stage itself — see .stage's own
     comment for why. A ::after is the LAST thing painted for its own
     box, so this always sits on top of every real child of .stage, same
     guarantee .obj::after already gives each individual element's own
     border. That alone isn't enough here though: every .obj gets an
     explicit inline z-index (see applyOrder/renderLayout) putting it in
     its own stacking context above .stage::after's default (auto) level
     regardless of DOM order — so this also needs its own z-index above
     the highest any .obj can reach. Deliberately placed just ABOVE
     .confetti-canvas's own 10000, not merely above .obj's ordering
     range — see editor.html's matching comment for why a tie isn't
     good enough here. */
  .stage::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 10001;
    pointer-events: none;
    border: var(--border-width) solid var(--accent);
    border-radius: var(--edge-rounding);
  }
  .stage-canvas-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-color: rgb(var(--canvas-bg-rgb) / var(--canvas-bg-alpha));
  }

  .obj {
    position: absolute;
    /* Centers each element's text stack within its own box, both axes —
       see editor.html's .obj rule for the full reasoning (mirrored here).
       align-items stays default (stretch) so ticker-wrapping children
       keep their full box width, needed for overflow/bounce/marquee-scroll
       math; .stat-label is the one plain-text exception, centered via its
       own align-self instead. */
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: rgb(var(--chip-rgb) / var(--chip-alpha));
    border-radius: var(--edge-rounding);
    box-shadow: 0 10px 24px -12px rgba(0, 0, 0, calc(var(--chip-alpha) * 0.75));
    /* No backdrop-filter here, unlike the editor's own canvas copy of this
       rule — deliberately removed.
       Two problems, one fix: (1) it can't do anything useful in a real OBS
       Browser Source anyway — backdrop-filter blurs whatever's already
       rendered on the SAME page behind the element, and in the actual
       output there's nothing there (the real video feed is composited by
       OBS afterward, outside the browser's own render); the frosted-glass
       look only ever showed in the editor because the checkerboard/canvas
       preview IS on-page content to blur. (2) reported live: with it
       present, OBS's Browser Source (CEF, a different rendering path than
       FeedBack's own Electron window) rendered the ENTIRE element
       invisible — not just un-blurred, the background color the plain
       `background` property above sets vanished too — while the
       equivalent `.stage-canvas-bg` background-color (no backdrop-filter
       on that element) composited correctly. Matches a known category of
       CEF/backdrop-filter compositing bug. */
    padding: 1px;
    transform-origin: top left;
    font-family: var(--font-display);
    font-size: 16px;
  }
  /* Border Thickness ring, as a ::after overlay instead of a real `border`
     property — a real border paints UNDER an element's own children (its
     text, or Album Art's <img>), so anything that touches or slightly
     overflows the box's edge (ticker text, object-fit:cover images) visually
     covers part of it. A ::after pseudo-element is always the LAST thing
     painted for its box, so this ring sits on top of everything inside the
     element, guaranteed, regardless of what that content does. inset:0
     draws it flush with the box's own edge, same place the real border used
     to sit, but — like the stage's own inset box-shadow ring above — takes
     no layout space, so removing the real border doesn't change any
     element's effective content area. pointer-events:none so it never
     blocks clicks/drags on the element beneath it. */
  .obj::after {
    content: '';
    position: absolute;
    inset: 0;
    border: var(--border-width) solid rgb(var(--accent-rgb) / 0.5);
    border-radius: var(--edge-rounding);
    pointer-events: none;
  }
  /* Album Art resizes via transform:scale() (see --art-scale's :root
     comment above), which scales this ::after ring right along with the
     box — at the default ~2x art scale its border rendered ~2x thicker
     than every other element's. Dividing border-width by --art-scale here
     cancels that out so Album Art's border reads as the same thickness as
     everywhere else. */
  .obj-art::after { border-width: calc(var(--border-width) / var(--art-scale, 1)); }

  .obj-art { width: 84px; height: 84px; padding: 1px; }
  .obj-art .art-img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    -webkit-user-drag: none;
    user-drag: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .obj-art .art-img.loaded { opacity: 1; }
  .obj-art .art-frame-line { position: absolute; inset: 4px; border: 1px solid rgba(243, 233, 216, 0.25); pointer-events: none; }

  .obj-info { width: max-content; }
  .title {
    margin: 0 0 3px; font-weight: 900;
    font-size: 1.2em; line-height: 1.15; color: var(--text-color); letter-spacing: -0.01em;
  }
  .artist { margin: 0; font-size: 0.84em; color: var(--paper-dim); font-weight: 600; }
  /* Marquee Scroll only: Song Title & Artist collapses to one line —
     "Artist - Song" — in the title's own large styling, scrolling as a
     single ticker, instead of two separately-scrolling lines. Class is
     toggled by applyLiveState() alongside the text swap into val-title;
     see its own comment. */
  .obj-info.info-combined-line .artist { display: none; }
  .obj-info.info-combined-line .title { margin-bottom: 0; }

  .obj-label { width: max-content; }
  /* font-size matches .stat-label exactly (var(--element-head-size), not
     em) — Now Playing's one line of text plays the same "header" role
     Tuning/Path/Year/Score's captions do, so it obeys the same Element
     Header Text Size setting instead of being scoped out of it.
     display:block (not the span default of inline) so it lays out the
     same way .stat-value/.custom-text do — needed now that its text
     lives inside a nested .ticker, which is itself display:block and
     needs a block-level ancestor to size/clip against correctly. */
  .eyebrow-standalone {
    display: block;
    font-size: var(--element-head-size, 10px); letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); font-weight: 700;
    white-space: nowrap;
  }

  /* text-align:center on .ticker (not .ticker-track) so the static,
     fits-fine case centers the text, while the animated states below
     reset it back to left — their translateX keyframes assume a
     flush-left starting position. See editor.html's .ticker rule. */
  .ticker { display: block; overflow: hidden; text-align: center; }
  .ticker.is-overflowing, .ticker.marquee-scroll-active { text-align: left; }
  .ticker-track { display: inline-block; white-space: nowrap; }
  .ticker.is-overflowing .ticker-track {
    animation-name: ticker-bounce;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes ticker-bounce {
    0%, 12%  { transform: translateX(0); }
    50%      { transform: translateX(var(--ticker-shift, 0)); }
    62%, 100% { transform: translateX(0); }
  }
  /* Marquee Scroll (opt-in, Visual Settings toggle) — a genuine
     continuous marquee-sign crawl instead of the bounce-on-overflow
     ticker above: setupMarqueeScrollTicker() (JS) duplicates the text
     into enough repeated .marquee-copy spans, evenly spaced by
     --marquee-gap, that shifting the whole track left by exactly one
     copy's width + gap (--marquee-unit) looks identical to the
     starting frame — so the loop is seamless and the next copy is
     always already chasing the tail of the one ahead of it, instead of
     the ticker sitting empty while a single instance travels all the
     way back around to re-enter. Mutually exclusive with
     .is-overflowing — JS never applies both to the same ticker at
     once. */
  .ticker.marquee-scroll-active .ticker-track {
    display: inline-flex;
    align-items: baseline;
    gap: var(--marquee-gap, 3em);
    animation-name: marquee-scroll-move;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: var(--marquee-duration, 8s);
  }
  .ticker.marquee-scroll-active .marquee-copy {
    flex: none;
    white-space: nowrap;
  }
  @keyframes marquee-scroll-move {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-1 * var(--marquee-unit, 100px))); }
  }
  /* Marquee flair — both opt-in per their own Visual Settings toggle.
     Marquee Stars (.marquee-stars-active, below) stays Marquee-Scroll-only
     — JS only ever adds it alongside .marquee-scroll-active, and its own
     checkbox is greyed out/force-unchecked whenever Scroll is off (see
     updateMarqueeSparkleLockState in editor.html). Edge Fade doesn't have
     that restriction: setupBounceTicker toggles this class off
     eff.marqueeEdgeFade directly, so it also fades the plain
     bounce-on-overflow ticker's edges when text is too long for its box,
     not just the continuous marquee-sign crawl. */
  .ticker.marquee-edge-fade-active {
    /* Percentage-based, not fixed px, so the fade stays proportional
       whether the element is tiny or huge instead of eating a bigger
       share of a small box. */
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
  }
  /* One small star per gap, pure CSS overlay via ::after — deliberately
     NOT an extra flex child, so it never changes --marquee-unit/the
     loop-distance math above; it just sits centered in the gap space
     that's already there. Staggered nth-child delays so multiple
     stars (short text in a wide box = many repeated copies = many
     gaps) don't all twinkle in lockstep.
     font-size is --marquee-star-size in PX, not em — reported live: at
     em, the exact same Marquee Star Size slider value rendered at a
     different actual pixel size on every element, since em is relative
     to whatever font-size that PARTICULAR element happens to be
     configured at (a big Song Title vs. a small Tuning value, etc.). An
     absolute px value is sized ONLY by the slider, identically on every
     element, regardless of that element's own font-size.
     :not(.marquee-link-copy) — Roll's link ticker (see
     buildLinkSegmentSpan) carries its own real trailing separator inside
     the copy's text content instead, so its wrap gap matches its internal
     "--"/"- ★ ★ ★ -" gaps exactly. Without this exclusion, this generic
     plain-star overlay painted on top of/instead of that real separator,
     reported live as a star cluster with no dashes at the loop's
     turnaround — a visibly different gap than every other one in the
     Roll. */
  .ticker.marquee-stars-active .marquee-copy {
    position: relative;
  }
  .ticker.marquee-stars-active .marquee-copy:not(.marquee-link-copy)::after {
    content: '\2605 \2605 \2605';
    position: absolute;
    left: calc(100% + var(--marquee-gap, 3em) / 2);
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--accent);
    font-size: var(--marquee-star-size, 10px);
    letter-spacing: 0.15em;
    line-height: 1;
    white-space: nowrap;
    pointer-events: none;
    animation: marquee-star-twinkle 1.6s ease-in-out infinite;
  }
  .ticker.marquee-stars-active .marquee-copy:nth-child(2n)::after { animation-delay: 0.4s; }
  .ticker.marquee-stars-active .marquee-copy:nth-child(3n)::after { animation-delay: 0.9s; }
  @keyframes marquee-star-twinkle {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 1; }
  }
  /* Marquee Scroll Roll's segment separators — the same colored,
     twinkling star cluster as the Marquee Stars flair's own repeat-gap
     stars above (same keyframe, same accent color, same size var), just
     inline within the combined text instead of an ::after overlay
     between repeats. See editor.html's matching comment for the full
     reasoning (mirrored here) — an earlier version hid an inactive
     cluster via visibility:hidden, which kept it invisible but still
     reserved its full layout space (the star text at the surrounding
     text's often-large font-size, plus this rule's own extra margin),
     reading as an oversized dead gap between merged segments even with
     Stars off. Fixed at the source instead — buildLinkSegmentSpan() (JS)
     now picks this span's TEXT CONTENT itself based on Marquee Stars:
     the real star cluster when on, or a few plain spaces (same as the
     bounce-mode separator) when off. This class now only carries what's
     ACTUALLY conditional: the color/size/animation that makes an active
     star cluster look like one. */
  .marquee-star-separator {
    display: inline-block;
    /* Load-bearing for the plain-space (Stars off) content specifically —
       see editor.html's matching comment for why: an inline-block whose
       ENTIRE content is whitespace gets that whitespace collapsed away to
       nothing (measured a genuine 0px live), so segments ran together
       with no gap at all instead of the intended small one.
       white-space:pre preserves it regardless of position; harmless for
       the active star cluster, which has real content and was never
       subject to this. */
    white-space: pre;
  }
  .ticker.marquee-stars-active .marquee-star-separator {
    color: var(--accent);
    font-size: var(--marquee-star-size, 10px);
    /* Breathing room around the star cluster specifically — plain-space
       mode needs none of this, it already reads fine at the surrounding
       text's own spacing (see the bounce-mode separator, which never had
       this either). */
    margin: 0 0.6em;
    animation: marquee-star-twinkle 1.6s ease-in-out infinite;
  }
  .ticker.marquee-scroll-active {
    position: relative;
  }
  /* Marquee Bulbs: ONE genuinely continuous ring of light bulbs tracing
     the element's own border, built from 4 edge strips (top/right/
     bottom/left) whose background-tile phases are computed together so
     they connect into a single seamless loop instead of 4 independent
     patterns. See editor.html's matching comment for the full reasoning
     (mirrored here) — tried an SVG dashed-stroke path first, but round
     bulbs need a near-zero dash length to render as circles rather than
     pills, and stroke-dashoffset isn't compositor-only the way
     `transform` is, so it read as jittery scroll motion at anything past
     the smallest bulb sizes. Back to 4 strips, but each edge's tile
     pattern gets an explicit phase offset (see setBulbLoop, JS) computed
     from its own cumulative distance around the shared perimeter, so the
     four edges are mathematically one continuous grid. */
  .marquee-bulb-edge-top,
  .marquee-bulb-edge-right,
  .marquee-bulb-edge-bottom,
  .marquee-bulb-edge-left {
    display: none;
    position: absolute;
    overflow: hidden;
    pointer-events: none;
    animation-name: var(--marquee-bulb-flicker-anim, none);
    animation-duration: 2.2s;
    animation-timing-function: steps(1, jump-none);
    animation-iteration-count: infinite;
    /* Negative delay, computed once per element in setBulbLoop() —
       synchronizes every element to one shared clock (this page's own
       load time) instead of each starting its own cycle from 0 the
       moment its bulb ring happens to get created. Without this, an
       element created later than the rest (Marquee Roll, custom text,
       or a built-in whose bulbs got toggled on after everyone else's)
       drifts out of phase — same pattern, same duration, just a
       different point in the cycle, most visible on Bulb Flicker's
       abrupt on/off jumps. A negative delay makes the browser treat the
       animation as already partway through, exactly where it would be
       if it truly had been running since the shared epoch. */
    animation-delay: var(--marquee-bulb-flicker-delay, 0s);
  }
  /* Inset by half a bulb diameter on the cross-axis, same idea as
     .obj's own padding elsewhere — centers the dot exactly ON the
     element's true edge instead of hanging half outside it.
     --marquee-bulb-frame-inset (0 by default) adds an extra, independent
     inward pull on top of that — only #stage's own ring gets a nonzero
     value (see applyDecorativeBulbs/editor.html's matching comment),
     pulling the layout border in far enough that it can never coincide
     with an element positioned flush against the canvas edge. */
  .marquee-bulb-edge-top, .marquee-bulb-edge-bottom {
    left: calc(var(--marquee-bulb-dot-size, 2.8px) / 2 + var(--marquee-bulb-frame-inset, 0px));
    right: calc(var(--marquee-bulb-dot-size, 2.8px) / 2 + var(--marquee-bulb-frame-inset, 0px));
    height: var(--marquee-bulb-dot-size, 2.8px);
  }
  .marquee-bulb-edge-top { top: var(--marquee-bulb-frame-inset, 0px); }
  .marquee-bulb-edge-bottom { bottom: var(--marquee-bulb-frame-inset, 0px); }
  .marquee-bulb-edge-left, .marquee-bulb-edge-right {
    top: calc(var(--marquee-bulb-dot-size, 2.8px) / 2 + var(--marquee-bulb-frame-inset, 0px));
    bottom: calc(var(--marquee-bulb-dot-size, 2.8px) / 2 + var(--marquee-bulb-frame-inset, 0px));
    width: var(--marquee-bulb-dot-size, 2.8px);
  }
  .marquee-bulb-edge-left { left: var(--marquee-bulb-frame-inset, 0px); }
  .marquee-bulb-edge-right { right: var(--marquee-bulb-frame-inset, 0px); }
  /* Not scoped to .ticker — every element wears this class directly on
     its own .obj container (see applyDecorativeBulbs()/applyBulbFrame),
     ticker or not.
     Direct-child combinator (>), NOT a plain descendant selector — see
     editor.html's matching comment: #stage can also carry
     marquee-bulbs-active now, and every element's own edge spans live
     inside #stage too, so a plain descendant selector matched them as
     soon as #stage had the class regardless of that element's own
     state. */
  .marquee-bulbs-active > .marquee-bulb-edge-top,
  .marquee-bulbs-active > .marquee-bulb-edge-right,
  .marquee-bulbs-active > .marquee-bulb-edge-bottom,
  .marquee-bulbs-active > .marquee-bulb-edge-left {
    display: block;
  }
  /* The moving layer — one tile wider/taller than its viewport so the
     translate can shift a full tile and land on an identical frame,
     looping seamlessly. --marquee-bulb-phase (set per edge, on the fill
     itself, in setBulbLoop) is the piece that turns 4 independent
     tilings into one connected grid. */
  .marquee-bulb-edge-fill {
    position: absolute;
    background-image: radial-gradient(circle, var(--bulb-hot, #ffd37a) calc(var(--marquee-bulb-dot-size, 2.8px) / 2), transparent calc(var(--marquee-bulb-dot-size, 2.8px) / 2 + 0.2px));
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: var(--marquee-bulb-duration, 0.175s);
    animation-delay: var(--marquee-bulb-scroll-delay, 0s);
  }
  .marquee-bulb-edge-top .marquee-bulb-edge-fill,
  .marquee-bulb-edge-bottom .marquee-bulb-edge-fill {
    top: 0;
    bottom: 0;
    left: 0;
    width: calc(100% + var(--marquee-bulb-tile, 0px));
    background-repeat: repeat-x;
    background-size: var(--marquee-bulb-tile, 0px) 100%;
    animation-name: var(--marquee-bulb-loop-anim-x, none);
  }
  .marquee-bulb-edge-left .marquee-bulb-edge-fill,
  .marquee-bulb-edge-right .marquee-bulb-edge-fill {
    left: 0;
    right: 0;
    top: 0;
    height: calc(100% + var(--marquee-bulb-tile, 0px));
    background-repeat: repeat-y;
    background-size: 100% var(--marquee-bulb-tile, 0px);
    animation-name: var(--marquee-bulb-loop-anim-y, none);
  }
  @keyframes marquee-bulb-loop-x {
    from { transform: translateX(var(--marquee-bulb-phase, 0px)); }
    to   { transform: translateX(calc(var(--marquee-bulb-phase, 0px) - var(--marquee-bulb-tile, 0px))); }
  }
  @keyframes marquee-bulb-loop-y {
    from { transform: translateY(var(--marquee-bulb-phase, 0px)); }
    to   { transform: translateY(calc(var(--marquee-bulb-phase, 0px) - var(--marquee-bulb-tile, 0px))); }
  }
  /* Every edge flows in its own direction, tracing one continuous loop
     around the whole frame: top flows left and right flows up (both the
     keyframes' own default direction, unchanged); bottom and left
     reverse the same keyframes to flow right and down respectively —
     see editor.html's matching comment for why reversing doesn't disturb
     the phase alignment above. */
  .marquee-bulb-edge-bottom .marquee-bulb-edge-fill,
  .marquee-bulb-edge-left .marquee-bulb-edge-fill {
    animation-direction: reverse;
  }
  /* Irregular dip points (not an even pulse) so it reads as an actual
     flickering bulb rather than a smooth breathing glow. Intensity
     scales how deep the dips go — 0 stays effectively invisible, 1 dips
     all the way to off. */
  @keyframes marquee-bulb-flicker {
    0%, 19%, 21%, 23%, 55%, 63%, 100% { opacity: 1; }
    20%, 22%, 54%, 62% { opacity: calc(1 - var(--marquee-bulb-flicker-intensity, 0.6)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker.is-overflowing .ticker-track { animation: none; }
    .ticker.marquee-scroll-active .ticker-track { animation: none; }
    .ticker.marquee-stars-active .marquee-copy::after { animation: none; opacity: 0.7; }
    .ticker.marquee-stars-active .marquee-star-separator { animation: none; opacity: 0.7; }
    .marquee-bulb-edge-top, .marquee-bulb-edge-right,
    .marquee-bulb-edge-bottom, .marquee-bulb-edge-left,
    .marquee-bulb-edge-fill { animation: none; }
  }

  .obj-stat { width: max-content; }
  /* align-self:center: width:max-content means the .obj default
     align-items:stretch can't stretch this to the box's width. Plain,
     non-scrolling caption text, so centering the box itself is correct
     (everything else here wraps a .ticker and centers via that instead). */
  .stat-label { display: block; width: max-content; align-self: center; font-size: var(--element-head-size, 10px); letter-spacing: 0.14em; text-transform: uppercase; color: var(--paper-dim); font-weight: 700; white-space: nowrap; }
  .stat-value {
    display: block;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 0.98em;
    color: var(--text-color);
  }

  .stat-value-percent {
    display: block;
    font-variant-numeric: tabular-nums;
    font-weight: 900;
    font-size: 1.65em;
    line-height: 1.05;
    color: var(--accent);
  }
  .stat-value-prev {
    /* Disabled per request (2026-07-20), alongside the val-prev JS below
       — not working correctly, and the underlying FeedBack stats/scoring
       code this depends on is expected to be reworked soon. Revert to
       `display: block;` (and re-enable the two commented lines in
       applyLiveState's score block) to bring it back. */
    display: none;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 0.7em;
    color: var(--paper-dim);
    margin-top: 2px;
  }

  .obj-progress { width: 240px; display: flex; flex-direction: row; align-items: center; gap: 8px; }
  /* Horizontal padding keeps the elapsed/duration values from sitting
     flush against .obj-progress's own edge — the box only has 1px of its
     own padding (see .obj), not enough room before the border ring, so the
     time text was getting visually clipped/crowded against it. */
  .time { font-variant-numeric: tabular-nums; font-size: 0.7em; color: var(--paper-dim); font-weight: 600; flex: 0 1 auto; min-width: 0; padding: 0 6px; }
  .progress-track { flex: 1; height: 3px; background: rgba(243, 233, 216, 0.14); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--bulb-hot)); transition: width 0.2s linear; }

  .obj-custom { width: max-content; }
  .custom-text { display: block; font-size: 0.9em; font-weight: 600; color: var(--text-color); }

  /* Same rule as the editor's own canvas — above every element's own
     z-index range, pointer-events:none so it's purely visual. Confetti
     never existed in the OBS-facing output before this — the original
     static render page this file's CSS/structure started as a copy of
     (see this file's own header comment for how it's since diverged)
     never had it either; it was editor-preview-only. */
  .confetti-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10000;
    /* OBS's Browser Source renders via CEF's off-screen rendering (OSR)
       mode, which is documented to sometimes miss repaints that are
       canvas-only (a rAF loop with no accompanying DOM/text mutation) —
       live-verified this round: the exact same event/canvas pipeline
       renders correctly in a real Chrome tab hitting this same render
       URL (screenshot-confirmed), so the code isn't the problem; this is
       a known OSR limitation. Forcing the canvas onto its own GPU
       compositing layer is the standard workaround — it nudges Chromium
       to track it as an independent paint target instead of relying on
       OSR's dirty-rect diffing to notice canvas-internal changes. */
    transform: translateZ(0);
    will-change: transform;
  }

  /* Scoped to .obj AND every descendant (the trailing `*`), not a list of
     specific text-class names. font-weight etc. are inherited properties,
     but several descendants (.artist, .eyebrow-standalone, .stat-value,
     .custom-text, ...) already set their OWN explicit font-weight for
     their normal look — an explicit value on the element itself always
     wins over an inherited one regardless of !important, since importance
     only decides between rules that target the SAME element. Matching
     every descendant directly, not just .obj, is what actually forces
     the override through — and it's what makes this reach any future
     element's text automatically, with no new selector to add here.
     currentColor still resolves per-element, not to .obj's own color, so
     each descendant's stroke still matches ITS own text color exactly as
     before. */
  .bold-active .obj,
  .bold-active .obj * {
    font-weight: 900 !important;
    font-synthesis: weight !important;
    -webkit-text-stroke: 0.5px currentColor;
    paint-order: stroke fill;
  }
  /* Per-element Bold override — see editor.html's matching comment. */
  .obj.style-override-bold-on,
  .obj.style-override-bold-on * {
    font-weight: 900 !important;
    font-synthesis: weight !important;
    -webkit-text-stroke: 0.5px currentColor;
    paint-order: stroke fill;
  }
  .obj.style-override-bold-off,
  .obj.style-override-bold-off * {
    font-weight: normal !important;
    font-synthesis: none !important;
    -webkit-text-stroke: 0 !important;
  }

  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  body { display: block; background: transparent; }
  .stage { width: 100vw; height: 100vh; }

  /* Connection-lost indicator — invisible in normal operation; a small dot
     so a streamer glancing at their preview can tell live data stalled
     instead of silently freezing on the last-known values. */
  #conn-dot {
    position: fixed; top: 6px; left: 6px; width: 8px; height: 8px; border-radius: 50%;
    background: #e0453c; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  #conn-dot.stale { opacity: 0.9; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- Reported live: "nothing should be visible at all" when the overlay
       fades out — this was previously a SIBLING of .stage, not a child,
       so it never faded with everything else (CSS opacity on an ancestor
       DOES apply to descendants even when they're position:fixed like
       this one — only its on-screen coordinates stay viewport-relative,
       not whether it's covered by an ancestor's opacity). Moved inside so
       it's covered by the exact same fade as everything else. -->
  <div id="conn-dot" aria-hidden="true"></div>
  <div class="stage-canvas-bg" aria-hidden="true"></div>

  <div class="obj obj-art" id="obj-art" data-id="art">
    <img class="art-img" id="art-img" alt="Album art" draggable="false" />
    <span class="art-frame-line" aria-hidden="true"></span>
  </div>

  <div class="obj obj-stat" id="obj-path" data-id="path">
    <span class="stat-label">Path</span>
    <span class="stat-value"><span class="ticker"><span class="ticker-track" id="val-path">—</span></span></span>
  </div>

  <div class="obj obj-label" id="obj-nowplaying" data-id="nowplaying">
    <span class="eyebrow-standalone"><span class="ticker"><span class="ticker-track">Now Playing</span></span></span>
  </div>

  <div class="obj obj-info" id="obj-info" data-id="info">
    <h2 class="title"><span class="ticker"><span class="ticker-track" id="val-title">—</span></span></h2>
    <p class="artist"><span class="ticker"><span class="ticker-track" id="val-artist">—</span></span></p>
  </div>

  <div class="obj obj-stat" id="obj-tuning" data-id="tuning">
    <span class="stat-label">Tuning</span>
    <span class="stat-value"><span class="ticker"><span class="ticker-track" id="val-tuning">—</span></span></span>
  </div>

  <div class="obj obj-stat" id="obj-year" data-id="year">
    <span class="stat-label">Year</span>
    <span class="stat-value"><span class="ticker"><span class="ticker-track" id="val-year">—</span></span></span>
  </div>

  <div class="obj obj-stat" id="obj-score" data-id="score">
    <span class="stat-label">Score</span>
    <span class="stat-value-percent"><span class="ticker"><span class="ticker-track" id="val-score">—</span></span></span>
    <span class="stat-value-prev"><span class="ticker"><span class="ticker-track" id="val-prev">&nbsp;</span></span></span>
  </div>

  <div class="obj obj-progress" id="obj-progress" data-id="progress">
    <span class="time"><span class="ticker"><span class="ticker-track" id="val-time-elapsed">0:00</span></span></span>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="time"><span class="ticker"><span class="ticker-track" id="val-time-duration">0:00</span></span></span>
  </div>

  <div class="obj obj-stat" id="obj-album" data-id="album">
    <span class="stat-label">Album</span>
    <span class="stat-value"><span class="ticker"><span class="ticker-track" id="val-album">—</span></span></span>
  </div>

  <canvas class="confetti-canvas" id="confettiCanvas" aria-hidden="true"></canvas>
</div>

<script>
  // ---- LAYOUT_DATA: position/size/visuals only — paste an export from the
  // editor over this object to change where things sit. CONTENT (song
  // title, score, ...) is never part of
  // this object here — that's supplied live over WebSocket. Currently
  // baked in: the Standard preset's defaults.
  //
  // IMPORTANT — set OBS's Browser Source Width/Height to EXACTLY match
  // visuals.stageWidth/stageHeight below (520x200 for this default).
  const LAYOUT_DATA = {
    version: 1,
    order: ['nowplaying', 'tuning', 'year', 'path', 'score', 'info', 'progress', 'album', 'art'],
    elements: {
      nowplaying: { x: 43.13099787785457, y: 0, width: 101.0521240234375, height: 20, fontSize: 16, visible: true, name: 'Now Playing' },
      tuning:     { x: 33.46253908597506, y: 29.703125000000004, width: 78.46353149414062, height: 45.00000762939453, fontSize: 16, visible: true, name: 'Tuning' },
      year:       { x: 48.55143326979417, y: 29.700519561767578, width: 47.833343505859375, height: 45, fontSize: 16, visible: true, name: 'Year' },
      path:       { x: 57.74989788348858, y: 29.700523376464844, width: 76.41535949707031, height: 45, fontSize: 16, visible: true, name: 'Path' },
      score:      { x: 72.44491577148438, y: 0, width: 143.2864227294922, height: 104.40625, fontSize: 20, visible: true, name: 'Score' },
      info:       { x: 33.46153846153846, y: 51.70312500000001, width: 345.98960876464844, height: 70.59375, fontSize: 20, visible: true, name: 'Song Title & Artist' },
      progress:   { x: 0, y: 87, width: 519.9947967529297, height: 26, fontSize: 20, visible: true, name: 'Song Time' },
      // New — same .obj-stat shape as Tuning/Year/Path, in the previously-
      // empty strip below Song Time instead of overlapping anything.
      album:      { x: 33.46153846153846, y: 120, width: 100, height: 45, fontSize: 16, visible: true, name: 'Album' },
      art:        { x: 0, y: 0, scale: 2.07142855844609, visible: true, name: 'Album Art' },
    },
    visuals: {
      accent: '#ff8200',
      accentRgb: '255 130 0',
      chipColor: '#000000',
      chipRgb: '0 0 0',
      chipAlpha: 0,
      borderWidth: 1,
      bold: false,
      font: 'Arial Black',
      stageWidth: 520,
      stageHeight: 200,
      canvasBgColor: '#000000',
      canvasBgRgb: '0 0 0',
      canvasBgAlpha: 0,
      elementHeadSize: 10,
      edgeRounding: 0,
      fadeSeconds: 10,
      confettiEnabled: true,
      confettiDuration: 7,
      confettiVolume: 0.1,
      confettiTriggerAt: 100,
      marqueeScroll: false,
      marqueeScrollSpeed: 80,
      marqueeEdgeFade: false,
      marqueeSparkle: false,
      marqueeSparkleSize: 10,
      marqueeBulbMode: 'off',
      marqueeBulbSize: 2.8,
      marqueeBulbGap: 11,
      marqueeBulbScroll: true,
      marqueeBulbFlicker: false,
      marqueeBulbFlickerIntensity: 0.6,
      marqueeBulbFlickerRandom: false,
    },
  };

  // Latest visuals object, kept at module scope — fireConfetti() (below)
  // needs confettiEnabled/Duration/Volume/TriggerAt, but `visuals` itself
  // only exists inside renderLayout()'s own closure.
  let lastVisuals = LAYOUT_DATA.visuals;
  // Same idea, for per-element overrides — applyLiveState() (song update
  // tick, runs far more often than a full layout re-render) needs to
  // resolve ONE element's (info's) effective marqueeScroll, but
  // layout/getEffectiveVisualsFor only exist inside renderLayout()'s own
  // closure too.
  let lastLayout = LAYOUT_DATA.elements;
  // Generic single-key override resolver — the read-only subset of
  // getEffectiveVisualsFor's logic needed by code outside renderLayout()'s
  // closure (which has the real per-key OVERRIDABLE_SETTINGS machinery).
  // Every key this is actually called with (marqueeScroll,
  // marqueeBulbFlickerRandom) falls straight back to visuals[key] with no
  // special-casing (unlike marqueeBulbs), so this simpler form is
  // equivalent for them.
  function effectiveFor(l, v, id, key) {
    const el = l && l[id];
    if (el && el.useCustomStyles && el.styleOverrides
        && Object.prototype.hasOwnProperty.call(el.styleOverrides, key)) {
      return el.styleOverrides[key];
    }
    return v && v[key];
  }
  // Captured ONCE, at true page load — the shared "epoch" every element's
  // bulb animations sync against (see setBulbLoop's own comment).
  // MUST live at this module scope, not inside renderLayout() — that
  // function re-runs on every layout broadcast (which fires on every
  // autosave tick while anything at all is being dragged, moved, or
  // resized, not just bulb-related edits), and a fresh `performance.now()`
  // captured on every one of those calls would reset "the epoch" itself
  // each time, making the sync math always compute a near-zero elapsed
  // time — exactly the reported bug: custom text (and anything else
  // rebuilt on a live layout update) restarting its flicker every time
  // an unrelated element gets moved, since it's always the ONLY thing
  // computing elapsed time freshly against a THEN-current declaration.
  const MARQUEE_BULB_EPOCH = performance.now();

  // ── layout/visuals renderer — same logic as the original static render page,
  // now a reusable named function instead of a run-once IIFE: the editor
  // (assets/editor.html) can save a new layout at
  // any time, and this gets re-invoked live via the WebSocket below so an
  // already-open OBS Browser Source picks it up without a refresh. ──
  function renderLayout(data) {
    const root = document.documentElement;
    const stage = document.getElementById('stage');
    const layout = data.elements;
    const order = data.order;
    const visuals = data.visuals;
    // Per-element visual overrides — output-only mirror of editor.html's
    // OVERRIDABLE_SETTINGS/getEffectiveVisualsFor/applyElementStyleOverrides
    // (see editor.html's own comments for the full design rationale,
    // including why Layout Size/Background/Confetti/Fade Out Time/
    // marqueeBulbSpeedLayout never appear here — marqueeBulbFlickerRandom
    // DOES, meaning something narrower than its global counterpart, see
    // editor.html's own comment on it). render.html never writes
    // layout[id].styleOverrides or
    // useCustomStyles itself — it only ever RESOLVES whatever the editor
    // already saved, so there's no UI here, just the same read-side
    // logic, gated the same single-flag way (useCustomStyles), not a
    // per-key one. textColor is ALSO intentionally absent here (unlike
    // editor.html's own OVERRIDABLE_SETTINGS, which does include it) —
    // this list only exists to feed getEffectiveVisualsFor()'s merged
    // `eff` object for ticker/bulb behavior; nothing here ever reads
    // eff.textColor. applyElementStyleOverrides below reads ov.textColor
    // directly instead, same as editor.html does.
    const OVERRIDABLE_SETTINGS = [
      { key: 'chipColor', type: 'coloralpha', alphaKey: 'chipAlpha' },
      { key: 'accent', type: 'color' },
      { key: 'bold', type: 'checkbox' },
      { key: 'font', type: 'font' },
      { key: 'borderWidth', type: 'range' },
      { key: 'edgeRounding', type: 'range' },
      { key: 'elementHeadSize', type: 'range' },
      { key: 'marqueeScroll', type: 'checkbox' },
      { key: 'marqueeScrollSpeed', type: 'range' },
      { key: 'marqueeEdgeFade', type: 'checkbox' },
      { key: 'marqueeSparkle', type: 'checkbox' },
      { key: 'marqueeSparkleSize', type: 'range' },
      { key: 'marqueeBulbs', type: 'checkbox' },
      { key: 'marqueeBulbSize', type: 'range' },
      { key: 'marqueeBulbGap', type: 'range' },
      { key: 'marqueeBulbSpeedElements', type: 'range' },
      { key: 'marqueeBulbScroll', type: 'checkbox' },
      { key: 'marqueeBulbFlicker', type: 'checkbox' },
      { key: 'marqueeBulbFlickerIntensity', type: 'range' },
      { key: 'marqueeBulbFlickerRandom', type: 'checkbox' },
    ];
    function globalFallbackFor(key) {
      if (key === 'marqueeBulbs') return visuals.marqueeBulbMode === 'all' || visuals.marqueeBulbMode === 'elements';
      return visuals[key];
    }
    // Mirrors editor.html's own hexToRgbChannels — recomputes the RGB
    // channel string from a hex color when a styleOverrides entry has
    // accent/chipColor but (e.g. from a hand-edited or older layout JSON)
    // is missing its accentRgb/chipRgb sibling, instead of writing an
    // empty --accent-rgb/--chip-rgb custom property (which breaks the
    // rgba(var(--accent-rgb), alpha) color functions that consume it).
    function hexToRgbChannels(hex) {
      const m = /^#([0-9a-fA-F]{6})$/.exec(hex);
      if (!m) return '0 0 0';
      const num = parseInt(m[1], 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255].join(' ');
    }
    function getEffectiveVisualsFor(id) {
      const useCustom = !!(layout[id] && layout[id].useCustomStyles);
      const ov = (useCustom && layout[id].styleOverrides) || {};
      const eff = {};
      OVERRIDABLE_SETTINGS.forEach(({ key }) => {
        eff[key] = Object.prototype.hasOwnProperty.call(ov, key) ? ov[key] : globalFallbackFor(key);
      });
      return eff;
    }
    function applyElementStyleOverrides(id) {
      const el = document.getElementById('obj-' + id);
      if (!el) return;
      const useCustom = !!(layout[id] && layout[id].useCustomStyles);
      const ov = (useCustom && layout[id].styleOverrides) || {};
      if ('chipColor' in ov) {
        el.style.setProperty('--chip-rgb', ov.chipRgb || hexToRgbChannels(ov.chipColor));
        el.style.setProperty('--chip-alpha', String(typeof ov.chipAlpha === 'number' ? ov.chipAlpha : 1));
      } else {
        el.style.removeProperty('--chip-rgb');
        el.style.removeProperty('--chip-alpha');
      }
      if ('accent' in ov) {
        el.style.setProperty('--accent', ov.accent);
        el.style.setProperty('--accent-rgb', ov.accentRgb || hexToRgbChannels(ov.accent));
      } else {
        el.style.removeProperty('--accent');
        el.style.removeProperty('--accent-rgb');
      }
      if ('textColor' in ov) {
        el.style.setProperty('--text-color', ov.textColor);
      } else {
        el.style.removeProperty('--text-color');
      }
      if ('borderWidth' in ov) {
        el.style.setProperty('--border-width', ov.borderWidth + 'px');
      } else {
        el.style.removeProperty('--border-width');
      }
      if ('edgeRounding' in ov) {
        el.style.setProperty('--edge-rounding', ov.edgeRounding + 'px');
      } else {
        el.style.removeProperty('--edge-rounding');
      }
      if ('elementHeadSize' in ov) {
        el.style.setProperty('--element-head-size', ov.elementHeadSize + 'px');
      } else {
        el.style.removeProperty('--element-head-size');
      }
      if ('marqueeSparkleSize' in ov) {
        el.style.setProperty('--marquee-star-size', ov.marqueeSparkleSize + 'px');
      } else {
        el.style.removeProperty('--marquee-star-size');
      }
      if ('font' in ov) {
        el.style.setProperty('--font-display', `"${ov.font}", 'Segoe UI', Arial, sans-serif`);
      } else {
        el.style.removeProperty('--font-display');
      }
      el.classList.toggle('style-override-bold-on', 'bold' in ov && ov.bold === true);
      el.classList.toggle('style-override-bold-off', 'bold' in ov && ov.bold === false);
    }
    function applyAllElementStyleOverrides() {
      Object.keys(layout).forEach(applyElementStyleOverrides);
    }
    // Captured BEFORE lastVisuals/lastLayout are overwritten below —
    // setBulbLoop() only ever sets --marquee-bulb-scroll-delay/
    // -flicker-delay ONCE per element (see its own comment), so flipping
    // Bulb Flicker Random (globally, or via any one element's own
    // override) needs an explicit forced resync afterward
    // (resyncAllBulbDelays()); without detecting the flip here, that
    // guard would just as correctly (and unhelpfully) protect the new
    // mode from ever taking effect on anything already running. Checked
    // per-element (not just the global flag) because an element's own
    // override can flip its EFFECTIVE value independently of Global.
    const bulbFlickerRandomChanged = Object.keys(layout).some((id) =>
      !!effectiveFor(lastLayout, lastVisuals, id, 'marqueeBulbFlickerRandom')
        !== !!effectiveFor(layout, visuals, id, 'marqueeBulbFlickerRandom'));
    lastVisuals = visuals;
    lastLayout = layout;

    // A re-apply (not the first call) may be dropping/renaming custom text
    // or Marquee Roll elements the previous layout had — clear them all
    // and let the "build custom/roll elements" step below recreate
    // whatever the NEW data actually contains, same as the editor's own
    // importState() does on every import rather than trying to diff old
    // vs. new ids. Reported live (only ever showing up inside FeedBack,
    // never when just testing the editor's own canvas preview — because
    // editor.html's loadPresetState already has its own removal step for
    // this, see its own comment): switching a preset that had a Roll to
    // one that didn't left that Roll's DOM element behind forever — the
    // per-id loops below only ever touch ids present in the CURRENT
    // layout, so an orphaned id from a previous layout is simply never
    // looked at again, staying fully visible with its last content
    // alongside whatever the new preset renders. .obj-custom already got
    // this treatment; .obj-roll needed the identical fix.

    } else {
      // Fade OUT is untouched — .stage's own rule (see its CSS comment)
      // already handles holding at 100% then ramping to a true 0%.
      stage.classList.remove('stage-visible');
    }
  }

  function applyLiveState(state) {
    if (!state) return;

    // Layout/visuals changed (editor save, or the very first frame) — this
    // must run BEFORE the content updates below so the final ticker-sizing
    // pass measures text against the CURRENT layout, not a stale one.
    const layoutJSON = state.layout ? JSON.stringify(state.layout) : null;
    if (layoutJSON && layoutJSON !== lastLayoutJSON) {
      lastLayoutJSON = layoutJSON;
      renderLayout(state.layout);
    } else if (!layoutJSON && lastLayoutJSON === null) {
      // Nothing saved yet anywhere (fresh install) — fall back to the
      // built-in default so the stage isn't empty before anyone's opened
      // the editor even once.
      lastLayoutJSON = JSON.stringify(LAYOUT_DATA);
      renderLayout(LAYOUT_DATA);
    }

    updateVisibility(state);

    const preview = (!state.song && state.preview) ? state.preview : null;
    const song = state.song || (preview && preview.song);
    const position = state.song ? state.position : ((preview && preview.position) || { time: 0, duration: 0 });
    const score = state.song ? state.score : (preview && preview.score);

    const artImg = document.getElementById('art-img');

    // Reported live: text reset to "—" and the album art vanished almost
    // instantly (its own fade-in/out transition is a fixed 0.25s) the
    // moment a song ended, while the STAGE's own opacity fade was just
    // starting its much slower multi-second transition — content visibly
    // popping away well before the box around it had finished fading, an
    // obviously mismatched "global fade speed." Fix: when there's no
    // song/preview to show, this whole block now does nothing at all
    // instead of blanking everything — the last real content just stays
    // frozen exactly as it was, and visually disappears ONLY via the
    // stage's own opacity fade (updateVisibility above), at the exact
    // same rate as literally everything else on the stage, because it's
    // the same one CSS transition on the shared ancestor. Content is only
    // actually replaced once a new song (or preview) genuinely arrives.
    if (song) {
      // Marquee Scroll only: one line, "Artist - Song", in the title's
      // own large styling, instead of two separately-scrolling lines —
      // see the .info-combined-line CSS comment. val-artist's text stays
      // in sync either way (cheap, and means toggling back needs no
      // special re-fetch), only its visibility and val-title's content
      // change with the mode.
      const infoObj = document.getElementById('obj-info');
      const combinedInfo = !!effectiveFor(lastLayout, lastVisuals, 'info', 'marqueeScroll');
      if (infoObj) infoObj.classList.toggle('info-combined-line', combinedInfo);
      if (combinedInfo) {
        setTextAndReticker('val-title', [song.artist, song.title].filter((s) => s).join(' - '));
      } else {
        setTextAndReticker('val-title', song.title);
      }
      setTextAndReticker('val-artist', song.artist);
      setTextAndReticker('val-tuning', abbreviateTuning(song.tuning));
      setTextAndReticker('val-path', song.path);
      setTextAndReticker('val-year', song.year);
      setTextAndReticker('val-album', song.album);
      if (song.artUrl && song.artUrl !== lastArtUrl) {
        lastArtUrl = song.artUrl;
        artImg.classList.remove('loaded');
        artImg.onload = () => artImg.classList.add('loaded');
        artImg.onerror = () => artImg.classList.remove('loaded');
        artImg.src = song.artUrl;
      } else if (!song.artUrl) {
        lastArtUrl = null;
        artImg.removeAttribute('src');
        artImg.classList.remove('loaded');
      }

      const pos = position || { time: 0, duration: 0 };
      setTextAndReticker('val-time-elapsed', fmtTime(pos.time));
      setTextAndReticker('val-time-duration', fmtTime(pos.duration));
      const pct = pos.duration > 0 ? Math.min(100, Math.max(0, (pos.time / pos.duration) * 100)) : 0;
      const fill = document.getElementById('progress-fill');
      if (fill) fill.style.width = pct + '%';

      // Reported live: the score vanished the instant a song ended, well
      // before the stage's own fade-out finished. Cause: note_detect
      // disables itself right around song-end (see currentScorePayload()'s
      // own comment in screen.js), so the score update right after
      // song:ended has hasCurrent:false, and this used to blank val-score
      // the moment that arrived. Fixed the same way title/art/position
      // already freeze instead of blanking (see this block's own header
      // comment above): val-score only ever gets cleared back to "—" when
      // a genuinely NEW song has loaded (tracked via filename); an
      // hasCurrent:false reading for the SAME song — "nothing judged yet"
      // right after load, or "song just ended" — leaves whatever's already
      // showing alone, so a real final score stays visible through the
      // fade instead of disappearing the instant the song stops. Known
      // minor edge case: replaying the identical file (same filename)
      // without leaving the player won't reset the display until the
      // first note of the new run is judged — accepted rather than adding
      // a second identity signal for a narrow, low-stakes case.
      const songKey = song.filename || null;
      if (songKey !== lastScoreSongKey) {
        lastScoreSongKey = songKey;
        setTextAndReticker('val-score', null);
      }
      if (score) {
        if (score.hasCurrent) setTextAndReticker('val-score', fmtPct(score.accuracy));
        // Previous-score ('Prev X%') display disabled per request
        // (2026-07-20) — not working correctly, and the underlying
        // FeedBack stats/scoring code this depends on is expected to
        // be reworked soon, so it's not worth chasing against a data
        // shape that's about to change. val-prev is simply never
        // written now, so it stays blank. Re-enable by uncommenting
        // both lines below once that's revisited.
        // setTextAndReticker('val-prev', score.prevAccuracy != null ? ('Prev ' + fmtPct(score.prevAccuracy)) : ' ');
      } else {
        // setTextAndReticker('val-prev', ' ');
      }
    }
    if (window._marqueeResolveRollGroups) window._marqueeResolveRollGroups();
  }

  // ── confetti — ported from the editor's own
  // fireConfetti() (the only place this ever existed before now; see the
  // .confetti-canvas CSS comment above). Logic is otherwise unchanged —
  // same particle system, same cannon+rain spawn pattern, same
  // accent-derived palette — the only real difference is WHAT calls it:
  // the editor only ever had a manual "Test Confetti" button (its own
  // comment there: "NOT wired to a real trigger yet... will need BOTH:
  // (1) the song actually ending... and (2) that song's final score
  // reading at or above visuals.confettiTriggerAt"). Both of those are
  // real now — see the "song-ended" WS event handling below, which is
  // exactly that trigger. ──
  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

  let confettiAnimId = null;
  function fireConfetti() {
    console.log('Marquee: fireConfetti() called');
    const visuals = lastVisuals || LAYOUT_DATA.visuals;
    if (!visuals.confettiEnabled) { console.log('Marquee: fireConfetti aborted — confettiEnabled is false'); return; }
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      console.log('Marquee: fireConfetti aborted — prefers-reduced-motion is on');
      return;
    }
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('confettiCanvas');
    if (!stage || !canvas) { console.log('Marquee: fireConfetti aborted — #stage or #confettiCanvas missing from the DOM'); return; }
    console.log('Marquee: confetti particle system starting');
    const dpr = window.devicePixelRatio || 1;
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff8200';
    const COLORS = [accent, '#ffd37a', '#f3e9d8', '#ff3b6b', '#3ba1ff', '#2ee87d', '#c65bff', '#ffe63b', '#ff7a1a', '#00e5ff', '#ff5cc0'];

    function currentDurationMs() {
      return clamp(visuals.confettiDuration, 1, 20) * 1000;
    }
    const MIN_RATE_PER_SEC = 20;
    const MAX_RATE_PER_SEC = 1200;
    const volume = clamp(visuals.confettiVolume, 0, 1);
    const ratePerSec = MIN_RATE_PER_SEC + volume * (MAX_RATE_PER_SEC - MIN_RATE_PER_SEC);
    const GRAVITY = 0.02;
    const ANGLE_SPREAD_DEG = 25;

    function spawnCannon() {
      const fromLeft = Math.random() < 0.5;
      const angleRad = ((45 + (Math.random() - 0.5) * ANGLE_SPREAD_DEG) * Math.PI) / 180;
      const speed = 1.8 + Math.random() * 1.4;
      return {
        x: fromLeft ? Math.random() * 14 : w - Math.random() * 14,
        y: h - Math.random() * 10,
        size: 4 + Math.random() * 5,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        vx: Math.cos(angleRad) * speed * (fromLeft ? 1 : -1),
        vy: -Math.sin(angleRad) * speed,
        rotation: Math.random() * 360,
        vr: (Math.random() - 0.5) * 12,
        rect: Math.random() < 0.5,
      };
    }
    function spawnRain() {
      return {
        x: Math.random() * w,
        y: -10,
        size: 4 + Math.random() * 5,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        vx: (Math.random() - 0.5) * 2.2,
        vy: 1 + Math.random() * 1.25,
        rotation: Math.random() * 360,
        vr: (Math.random() - 0.5) * 12,
        rect: Math.random() < 0.5,
      };
    }

    if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
    let particles = [];
    let cannonCarry = 0;
    let rainCarry = 0;
    const start = performance.now();
    let lastFrameTime = start;
    function frame(now) {
      const elapsed = now - start;
      const dt = now - lastFrameTime;
      lastFrameTime = now;
      const durationMs = currentDurationMs();
      const fadeMs = Math.min(500, durationMs * 0.3);
      const fade = elapsed > durationMs - fadeMs ? Math.max(0, (durationMs - elapsed) / fadeMs) : 1;

      if (elapsed < durationMs) {
        cannonCarry += (ratePerSec / 2) * (dt / 1000);
        rainCarry += (ratePerSec / 2) * (dt / 1000);
        while (cannonCarry >= 1) {
          const p = spawnCannon();
          const phase = Math.random();
          p.x += p.vx * phase;
          p.y += p.vy * phase;
          p.vy += GRAVITY * phase;
          particles.push(p);
          cannonCarry -= 1;
        }
        while (rainCarry >= 1) {
          const p = spawnRain();
          const phase = Math.random();
          p.x += p.vx * phase;
          p.y += p.vy * phase;
          p.vy += GRAVITY * phase;
          particles.push(p);
          rainCarry -= 1;
        }
      }

      ctx.clearRect(0, 0, w, h);
      particles = particles.filter((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += GRAVITY;
        p.rotation += p.vr;
        if (p.y - p.size > h) return false;
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        if (p.rect) {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        return true;
      });

      if (elapsed < durationMs || particles.length > 0) {
        confettiAnimId = requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, w, h);
        confettiAnimId = null;
      }
    }
    confettiAnimId = requestAnimationFrame(frame);
  }

  // The real trigger: a song-ended event (see routes.py/screen.js) whose
  // final score met or beat the configured threshold. >= , not > — a
  // Trigger At of 100 means "only a perfect run," and a perfect run's
  // accuracy is exactly 1.
  function handleServerEvent(data) {
    console.log('Marquee: received server event', data);
    if (data.event === 'song-ended') {
      const visuals = lastVisuals || LAYOUT_DATA.visuals;
      const sc = data.score;
      const pct = sc ? (sc.accuracy * 100) : null;
      console.log('Marquee: confetti check — score =', sc, 'accuracy% =', pct,
        'confettiEnabled =', visuals.confettiEnabled, 'confettiTriggerAt =', visuals.confettiTriggerAt);
      if (!sc || !sc.hasCurrent) {
        console.log('Marquee: confetti NOT fired — no current score on this event');
      } else if (typeof visuals.confettiTriggerAt !== 'number') {
        console.log('Marquee: confetti NOT fired — confettiTriggerAt missing from visuals');
      } else if (pct < visuals.confettiTriggerAt) {
        console.log('Marquee: confetti NOT fired — ' + pct.toFixed(2) + '% is below the ' + visuals.confettiTriggerAt + '% trigger');
      } else {
        console.log('Marquee: confetti FIRING —', pct.toFixed(2) + '% >= ' + visuals.confettiTriggerAt + '%');
        fireConfetti();
      }
    }
  }

  // ── transport: WebSocket to this plugin's own backend, relative to
  // wherever this render page is being served from (works identically
  // whether OBS/browser hits it via 127.0.0.1 or a LAN hostname — no
  // hardcoded port, since the desktop build's backend port isn't fixed
  // at 8000 the way `python main.py`'s default is; confirmed live it can
  // be a different port, e.g. 18000, depending on how the app was packaged/launched). ──
  const PLUGIN_ID = 'marquee';
  let connDotTimer = null;
  function markStale(stale) {
    const dot = document.getElementById('conn-dot');
    if (dot) dot.classList.toggle('stale', !!stale);
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(proto + '://' + location.host + `/ws/plugins/${PLUGIN_ID}/live`);
    ws.onopen = () => markStale(false);
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data && data.event) handleServerEvent(data);
        else applyLiveState(data);
      } catch (e) { /* ignore malformed frame */ }
    };
    ws.onclose = () => { markStale(true); setTimeout(connect, 1000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  fetch(`/api/plugins/${PLUGIN_ID}/state`).then((r) => r.json()).then(applyLiveState).catch(() => {});
  connect();
</script>
</body>
</html>
