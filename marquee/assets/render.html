<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marquee — Overlay Output</title>
<style>
  /* Layout/visuals CSS started as a copy of the original static render page
     but has since diverged (stage border made inset, backdrop-filter removed,
     confetti-canvas + fade rules added) — see the comments on those rules below
     for why. This page differs from that source both in content delivery
     (live WS push vs. baked-in text) and in these CSS fixes. */
  :root {
    font-size: 18px;
    --void: #16110d;
    --void-2: #1d1712;
    --curtain: #3a1518;
    --gold: #e8a33d;
    --bulb-hot: #ffd37a;
    --paper: #f3e9d8;
    --paper-dim: #b8a88c;
    /* Text Color control's own var — see editor.html's identical :root
       comment (mirrored here). Only the rendered content text
       (.title/.stat-value/.custom-text) reads this instead of --paper. */
    --text-color: #f3e9d8;
    /* Header/caption text (Path/Tuning/Year/Score/Album's small-caps
       labels, and the standalone "Now Playing" label) — separate from
       --accent (border) and --text-color (value text below each caption).
       Defaults to the old --paper-dim value so nothing changes visually
       until the control is actually touched. */
    --header-text-color: #b8a88c;

    --accent: #ff8200;
    --accent-rgb: 255 130 0;
    --chip-rgb: 0 0 0;
    --chip-alpha: 0;
    --canvas-bg-rgb: 0 0 0;
    --canvas-bg-alpha: 0;
    --element-head-size: 10px;
    --element-text-size: 16px;
    --border-width: 1px;
    --edge-rounding: 0px;
    /* Marquee Bulbs' own size/gap live in visuals.marqueeBulbSize/
       marqueeBulbGap (plain JS state, read directly by setBulbLoop())
       rather than a CSS custom property — its dash pattern has to divide
       the element's actual current perimeter evenly, which only JS can
       compute, so there's nothing for a CSS var to drive here. */
    /* Album Art is the one element positioned via a CSS transform:scale()
       on itself (see the `if ('scale' in pos)` branch below) rather than
       plain width/height — since a transform magnifies every descendant
       uniformly, its bulb ring would otherwise render `scale`x bigger
       than the same configured Bulb Size/Gap everywhere else. --art-scale
       defaults to 1 (a no-op) and is overridden only on #obj-art itself,
       right alongside where its transform is set; setBulbLoop() reads it
       straight off the element and divides it back out, so the
       correction stays in sync with live resizing without any CSS
       involved. */
    --art-scale: 1;
    --marquee-star-size: 10px;
    --marquee-bulb-flicker-intensity: 0.6;
    --content-width: min(1200px, 94vw);
    --stage-w-px: 520px;
    --stage-ratio: 520 / 200;

    --font-display: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Consolas', 'SFMono-Regular', Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    color: var(--paper);
    font-family: var(--font-body);
    padding: clamp(20px, 4vw, 56px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  /* Embedded mode (editor.html's live-render-preview iframe, see boot
     script below for how .embedded gets added to body): the iframe is
     deliberately sized to the stage's EXACT pixel dimensions by its
     parent, with no slack for the standalone rules below. body's own
     padding plus .stage's 94vw safety cap (both meant for a real
     browser tab/OBS source, which always has room to spare) together
     made .stage wider than a narrow preset's own iframe viewport (300px
     Small/Tall vs. e.g. 520px Standard, which has slack to absorb it) —
     the overflow scrolled the iframe horizontally, and starting
     scrolled-to-0 showed only the left portion, reading as "offset
     left." Real OBS Browser Source always loads this page top-level
     (window.self === window.top there), so this never touches the
     actual output — only the embedded preview. */
  /* overflow:hidden on BOTH html and body — which one actually owns the
     viewport's scrollbar is inconsistent across engines, so both are set
     rather than relying on one. Without this, a native scrollbar could
     appear (classic hysteresis: content computes fractionally taller than
     the viewport at some point during layout, even if scrollHeight and
     clientHeight end up equal afterward) and, once shown, permanently eat
     ~17px of width — shrinking the available area .stage renders into
     without shrinking .stage itself, so it no longer fits and overflows
     HORIZONTALLY too. This page is a fixed-size overlay, never meant to
     scroll at all in embedded mode, so suppressing scrolling entirely is
     correct, not just a workaround. */
  html.embedded, body.embedded { overflow: hidden; }
  body.embedded { padding: 0; }
  /* height: auto, not left alone — a LATER, same-specificity `.stage`
     rule (search "width: 100vw" below) sets BOTH width and height to
     100vw/100vh, which is what makes the real OBS Browser Source fill
     whatever pixel dimensions are configured there, completely
     independent of --stage-w-px/--stage-ratio. This rule's higher
     specificity (two classes vs. one) already wins on width, but without
     also resetting height, embedded mode was silently keeping height:
     100vh from that other rule — with BOTH width and height explicit,
     aspect-ratio has no effect (it only derives an auto dimension), so
     .stage rendered at the correct WIDTH but an unrelated height (100% of
     the iframe's own viewport height, only right by coincidence when it
     happened to already match). height: auto here is what actually lets
     aspect-ratio: var(--stage-ratio) (see the earlier .stage rule) derive
     the correct height FROM that width, for any preset's own aspect. */
  body.embedded .stage { width: var(--stage-w-px); height: auto; }
  .stage {
    position: relative;
    width: min(var(--stage-w-px), 94vw);
    aspect-ratio: var(--stage-ratio);
    border-radius: var(--edge-rounding);
    overflow: hidden;
    background: transparent;
    /* Drop shadow only now — the layout-wide border ring moved to
       .stage::after below (see its own comment for why: box-shadow/
       border on .stage ITSELF paints as part of .stage's own box
       decoration, which happens BEFORE any of .stage's children paint —
       so any element sitting flush against the canvas edge (full-bleed
       Album Art, a full-width Marquee Roll/banner, ...) painted directly
       over the ring wherever they overlapped it. Reported live: the
       ring didn't show at all in a real OBS output, because the active
       layout had element(s) covering it basically all the way around.
       This exact "children paint over my own border" problem is why
       .obj::after exists for individual elements (see its own comment)
       — .stage needed the identical fix, just at the canvas level
       instead of the per-element one. This box-shadow's own inset-vs-
       outset history (it used to double as the border ring too, drawn
       inset so it wouldn't get clipped by the stage having zero space
       outside it) is moot now that the border isn't here at all. */
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.8);
    /* Whole-overlay fade, driven by JS toggling .stage-visible based on
       state.song (or an active editor preview) — see updateVisibility()
       below. Starts invisible: nothing should show before we've heard
       from the backend at all, matching "invisible when no song is
       playing" as the default rather than a brief flash of the last
       static build's placeholder-ish look. --fade-seconds comes from
       visuals.fadeSeconds (editor-configurable, default 5s).
       Fade OUT (this rule — the class getting REMOVED transitions
       toward whatever THIS selector says): reads as "stays fully
       visible, then disappears in one quick beat at the very end,"
       not "gradually gets dimmer for the whole configured duration."
       transition-delay holds the current (visible) opacity in place for
       (--fade-seconds minus 1s), THEN the 1s duration ramps it down —
       so no matter how long --fade-seconds is (5s, 10s, whatever), the
       actual visible ramp is always the last 1 second of it.
       min(1s, ...) on the duration and max(..., 0s) on the delay both
       exist for the same reason: a --fade-seconds shorter than 1s (or
       0s outright, e.g. the "USER" preset's all-off default) has less
       than a full second to work with at all — clamping both keeps a
       sub-1s or zero setting fading over its own real length (or not
       fading at all at 0s) instead of a flat 1s ramp ignoring what was
       actually configured. */
    opacity: 0;
    transition: opacity min(1s, var(--fade-seconds, 5s)) ease-in max(calc(var(--fade-seconds, 5s) - 1s), 0s);
  }
  .stage.stage-visible {
    opacity: 1;
    /* Fade IN: a decelerating curve instead of linear — reads as
       "already most of the way there almost immediately, then eases
       into fully settled" rather than a uniform ramp the whole way.
       Duration is the full --fade-seconds here (unlike fade-out above,
       there's no "only the last second" ask for this direction). */
    transition: opacity var(--fade-seconds, 5s) cubic-bezier(0.05, 0.7, 0.1, 1);
  }
  /* The layout-wide border ring, as a ::after pseudo-element instead of a
     box-shadow/border property on .stage itself — see .stage's own
     comment for why. A ::after is the LAST thing painted for its own
     box, so this always sits on top of every real child of .stage, same
     guarantee .obj::after already gives each individual element's own
     border. That alone isn't enough here though: every .obj gets an
     explicit inline z-index (see applyOrder/renderLayout) putting it in
     its own stacking context above .stage::after's default (auto) level
     regardless of DOM order — so this also needs its own z-index above
     the highest any .obj can reach. Deliberately placed just ABOVE
     .confetti-canvas's own 10000, not merely above .obj's ordering
     range — see editor.html's matching comment for why a tie isn't
     good enough here. */
  .stage::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 10001;
    pointer-events: none;
    border: var(--border-width) solid var(--accent);
    border-radius: var(--edge-rounding);
  }
  .stage-canvas-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-color: rgb(var(--canvas-bg-rgb) / var(--canvas-bg-alpha));
  }

  .obj {
    position: absolute;
    /* Centers each element's text stack within its own box, both axes —
       see editor.html's .obj rule for the full reasoning (mirrored here).
       align-items stays default (stretch) so ticker-wrapping children
       keep their full box width, needed for overflow/bounce/marquee-scroll
       math; .stat-label is the one plain-text exception, centered via its
       own align-self instead. */
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: rgb(var(--chip-rgb) / var(--chip-alpha));
    border-radius: var(--edge-rounding);
    box-shadow: 0 10px 24px -12px rgba(0, 0, 0, calc(var(--chip-alpha) * 0.75));
    /* No backdrop-filter here, unlike the editor's own canvas copy of this
       rule — deliberately removed.
       Two problems, one fix: (1) it can't do anything useful in a real OBS
       Browser Source anyway — backdrop-filter blurs whatever's already
       rendered on the SAME page behind the element, and in the actual
       output there's nothing there (the real video feed is composited by
       OBS afterward, outside the browser's own render); the frosted-glass
       look only ever showed in the editor because the checkerboard/canvas
       preview IS on-page content to blur. (2) reported live: with it
       present, OBS's Browser Source (CEF, a different rendering path than
       FeedBack's own Electron window) rendered the ENTIRE element
       invisible — not just un-blurred, the background color the plain
       `background` property above sets vanished too — while the
       equivalent `.stage-canvas-bg` background-color (no backdrop-filter
       on that element) composited correctly. Matches a known category of
       CEF/backdrop-filter compositing bug. */
    padding: 1px;
    transform-origin: top left;
    font-family: var(--font-display);
    font-size: var(--element-text-size, 16px);
  }
  /* Border Thickness ring, as a ::after overlay instead of a real `border`
     property — a real border paints UNDER an element's own children (its
     text, or Album Art's <img>), so anything that touches or slightly
     overflows the box's edge (ticker text, object-fit:cover images) visually
     covers part of it. A ::after pseudo-element is always the LAST thing
     painted for its box, so this ring sits on top of everything inside the
     element, guaranteed, regardless of what that content does. inset:0
     draws it flush with the box's own edge, same place the real border used
     to sit, but — like the stage's own inset box-shadow ring above — takes
     no layout space, so removing the real border doesn't change any
     element's effective content area. pointer-events:none so it never
     blocks clicks/drags on the element beneath it. */
  .obj::after {
    content: '';
    position: absolute;
    inset: 0;
    border: var(--border-width) solid rgb(var(--accent-rgb) / 0.5);
    border-radius: var(--edge-rounding);
    pointer-events: none;
  }
  /* Album Art resizes via transform:scale() (see --art-scale's :root
     comment above), which scales this ::after ring right along with the
     box — at the default ~2x art scale its border rendered ~2x thicker
     than every other element's. Dividing border-width by --art-scale here
     cancels that out so Album Art's border reads as the same thickness as
     everywhere else. */
  .obj-art::after { border-width: calc(var(--border-width) / var(--art-scale, 1)); }

  .obj-art { width: 84px; height: 84px; padding: 1px; }
  .obj-art .art-img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    -webkit-user-drag: none;
    user-drag: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .obj-art .art-img.loaded { opacity: 1; }
  .obj-art .art-frame-line { position: absolute; inset: 4px; border: 1px solid rgba(243, 233, 216, 0.25); pointer-events: none; }

  .obj-info { width: max-content; }
  .title {
    margin: 0 0 3px; font-weight: 900;
    font-size: 1.2em; line-height: 1.15; color: var(--text-color); letter-spacing: -0.01em;
  }
  /* Was var(--paper-dim) — a fixed editor-chrome color untouched by the
     Text Color control, so the band/artist line couldn't be recolored at
     all. Derives from --text-color (dimmed via opacity) instead, same as
     .title/.stat-value/.custom-text, while keeping it visually subdued
     relative to the title. */
  .artist { margin: 0; font-size: 0.84em; color: var(--text-color); opacity: 0.72; font-weight: 600; }
  /* Marquee Scroll only: Song Title & Artist collapses to one line —
     "Artist - Song" — in the title's own large styling, scrolling as a
     single ticker, instead of two separately-scrolling lines. Class is
     toggled by applyLiveState() alongside the text swap into val-title;
     see its own comment. */
  .obj-info.info-combined-line .artist { display: none; }
  .obj-info.info-combined-line .title { margin-bottom: 0; }

  .obj-label { width: max-content; }
  /* font-size matches .stat-label exactly (var(--element-head-size), not
     em) — Now Playing's one line of text plays the same "header" role
     Tuning/Path/Year/Score's captions do, so it obeys the same Element
     Header Text Size setting instead of being scoped out of it.
     display:block (not the span default of inline) so it lays out the
     same way .stat-value/.custom-text do — needed now that its text
     lives inside a nested .ticker, which is itself display:block and
     needs a block-level ancestor to size/clip against correctly. */
  .eyebrow-standalone {
    display: block;
    font-size: var(--element-head-size, 10px); letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--header-text-color); font-weight: 700;
    white-space: nowrap;
  }

  /* text-align:center on .ticker (not .ticker-track) so the static,
     fits-fine case centers the text, while the animated states below
     reset it back to left — their translateX keyframes assume a
     flush-left starting position. See editor.html's .ticker rule. */
  .ticker { display: block; overflow: hidden; text-align: center; }
  .ticker.is-overflowing, .ticker.marquee-scroll-active { text-align: left; }
  .ticker-track { display: inline-block; white-space: nowrap; }
  .ticker.is-overflowing .ticker-track {
    animation-name: ticker-bounce;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes ticker-bounce {
    0%, 12%  { transform: translateX(0); }
    50%      { transform: translateX(var(--ticker-shift, 0)); }
    62%, 100% { transform: translateX(0); }
  }
  /* Marquee Scroll (opt-in, Visual Settings toggle) — a genuine
     continuous marquee-sign crawl instead of the bounce-on-overflow
     ticker above: setupMarqueeScrollTicker() (JS) duplicates the text
     into enough repeated .marquee-copy spans, evenly spaced by
     --marquee-gap, that shifting the whole track left by exactly one
     copy's width + gap (--marquee-unit) looks identical to the
     starting frame — so the loop is seamless and the next copy is
     always already chasing the tail of the one ahead of it, instead of
     the ticker sitting empty while a single instance travels all the
     way back around to re-enter. Mutually exclusive with
     .is-overflowing — JS never applies both to the same ticker at
     once. */
  .ticker.marquee-scroll-active .ticker-track {
    display: inline-flex;
    align-items: baseline;
    gap: var(--marquee-gap, 3em);
    animation-name: marquee-scroll-move;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: var(--marquee-duration, 8s);
  }
  .ticker.marquee-scroll-active .marquee-copy {
    flex: none;
    white-space: nowrap;
  }
  @keyframes marquee-scroll-move {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-1 * var(--marquee-unit, 100px))); }
  }
  /* Marquee flair — both opt-in per their own Visual Settings toggle.
     Marquee Stars (.marquee-stars-active, below) stays Marquee-Scroll-only
     — JS only ever adds it alongside .marquee-scroll-active, and its own
     checkbox is greyed out/force-unchecked whenever Scroll is off (see
     updateMarqueeSparkleLockState in editor.html). Edge Fade doesn't have
     that restriction: setupBounceTicker toggles this class off
     eff.marqueeEdgeFade directly, so it also fades the plain
     bounce-on-overflow ticker's edges when text is too long for its box,
     not just the continuous marquee-sign crawl. */
  .ticker.marquee-edge-fade-active {
    /* Percentage-based, not fixed px, so the fade stays proportional
       whether the element is tiny or huge instead of eating a bigger
       share of a small box. */
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
  }
  /* One small star per gap, pure CSS overlay via ::after — deliberately
     NOT an extra flex child, so it never changes --marquee-unit/the
     loop-distance math above; it just sits centered in the gap space
     that's already there. Staggered nth-child delays so multiple
     stars (short text in a wide box = many repeated copies = many
     gaps) don't all twinkle in lockstep.
     font-size is --marquee-star-size in PX, not em — reported live: at
     em, the exact same Marquee Star Size slider value rendered at a
     different actual pixel size on every element, since em is relative
     to whatever font-size that PARTICULAR element happens to be
     configured at (a big Song Title vs. a small Tuning value, etc.). An
     absolute px value is sized ONLY by the slider, identically on every
     element, regardless of that element's own font-size.
     :not(.marquee-link-copy) — Roll's link ticker (see
     buildLinkSegmentSpan) carries its own real trailing separator inside
     the copy's text content instead, so its wrap gap matches its internal
     "--"/"- ★ ★ ★ -" gaps exactly. Without this exclusion, this generic
     plain-star overlay painted on top of/instead of that real separator,
     reported live as a star cluster with no dashes at the loop's
     turnaround — a visibly different gap than every other one in the
     Roll. */
  .ticker.marquee-stars-active .marquee-copy {
    position: relative;
  }
  .ticker.marquee-stars-active .marquee-copy:not(.marquee-link-copy)::after {
    content: '\2605 \2605 \2605';
    position: absolute;
    left: calc(100% + var(--marquee-gap, 3em) / 2);
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--accent);
    font-size: var(--marquee-star-size, 10px);
    letter-spacing: 0.15em;
    line-height: 1;
    white-space: nowrap;
    pointer-events: none;
    animation: marquee-star-twinkle 1.6s ease-in-out infinite;
  }
  .ticker.marquee-stars-active .marquee-copy:nth-child(2n)::after { animation-delay: 0.4s; }
  .ticker.marquee-stars-active .marquee-copy:nth-child(3n)::after { animation-delay: 0.9s; }
  @keyframes marquee-star-twinkle {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 1; }
  }
  /* Marquee Scroll Roll's segment separators — the same colored,
     twinkling star cluster as the Marquee Stars flair's own repeat-gap
     stars above (same keyframe, same accent color, same size var), just
     inline within the combined text instead of an ::after overlay
     between repeats. See editor.html's matching comment for the full
     reasoning (mirrored here) — an earlier version hid an inactive
     cluster via visibility:hidden, which kept it invisible but still
     reserved its full layout space (the star text at the surrounding
     text's often-large font-size, plus this rule's own extra margin),
     reading as an oversized dead gap between merged segments even with
     Stars off. Fixed at the source instead — buildLinkSegmentSpan() (JS)
     now picks this span's TEXT CONTENT itself based on Marquee Stars:
     the real star cluster when on, or a few plain spaces (same as the
     bounce-mode separator) when off. This class now only carries what's
     ACTUALLY conditional: the color/size/animation that makes an active
     star cluster look like one. */
  .marquee-star-separator {
    display: inline-block;
    /* Load-bearing for the plain-space (Stars off) content specifically —
       see editor.html's matching comment for why: an inline-block whose
       ENTIRE content is whitespace gets that whitespace collapsed away to
       nothing (measured a genuine 0px live), so segments ran together
       with no gap at all instead of the intended small one.
       white-space:pre preserves it regardless of position; harmless for
       the active star cluster, which has real content and was never
       subject to this. */
    white-space: pre;
  }
  .ticker.marquee-stars-active .marquee-star-separator {
    color: var(--accent);
    font-size: var(--marquee-star-size, 10px);
    /* Breathing room around the star cluster specifically — plain-space
       mode needs none of this, it already reads fine at the surrounding
       text's own spacing (see the bounce-mode separator, which never had
       this either). */
    margin: 0 0.6em;
    animation: marquee-star-twinkle 1.6s ease-in-out infinite;
  }
  .ticker.marquee-scroll-active {
    position: relative;
  }
  /* Marquee Bulbs: ONE genuinely continuous ring of light bulbs tracing
     the element's own border, built from individual bulb-dot elements
     placed along a single CSS offset-path (the element's own rectangle
     outline) rather than 4 separately-tiled/clipped edge strips (an
     earlier version of this — see editor.html's matching comment for
     the fuller history of why that approach got replaced). Since every
     dot is a real, fully-formed circle at an exact point on ONE
     continuous path, there's no strip boundary to clip against and no
     seam where two independently-moving pieces could ever become
     simultaneously visible in the same spot. See setBulbLoop (JS) for
     how each dot's path position/timing is computed — evenly spacing N
     dots along one path is automatically "one continuous loop,"
     including at the corners, with no separate cross-edge continuity
     math needed at all. */
  .marquee-bulb-dot {
    display: none;
    position: absolute;
    /* Pins this box's pre-offset-path "static position" to the
       container's own top-left instead of leaving it auto. Without
       this, a container like .obj (display:flex, flex-direction:column,
       justify-content:center) computes an absolutely-positioned child's
       static position via the flex centering algorithm — offset-path
       then adds its own path-relative translation ON TOP of that,
       instead of replacing it, so the whole ring rendered vertically
       centered-then-offset rather than anchored at the box's true
       top-left (reported live: bulbs on individual elements anchored
       around the element's center instead of its corner). left/top:0
       makes the pre-path position a fixed, known (0,0) so offset-path's
       own coordinates (already computed relative to that same top-left
       in setBulbLoop, JS) are the only thing determining final
       position. */
    left: 0;
    top: 0;
    /* Half a pixel of margin beyond the radial-gradient's own opaque
       radius (see background, below) so its soft transparent falloff
       has room to render without being clipped by the dot's own box. */
    width: calc(var(--marquee-bulb-dot-size, 2.8px) + 0.4px);
    height: calc(var(--marquee-bulb-dot-size, 2.8px) + 0.4px);
    background: radial-gradient(circle, var(--bulb-hot, #ffd37a) calc(var(--marquee-bulb-dot-size, 2.8px) / 2), transparent calc(var(--marquee-bulb-dot-size, 2.8px) / 2 + 0.2px));
    pointer-events: none;
    offset-path: var(--marquee-bulb-ring-path, none);
    offset-anchor: center;
    /* Keeps the (round, so it wouldn't visibly matter anyway) dot from
       rotating to face the path's own direction of travel as it goes —
       explicit rather than relying on the initial/default value, in
       case that default ever changes. */
    offset-rotate: 0deg;
    /* Resting/fallback position — bulbOrbitTick (JS) sets this element's
       own inline offsetDistance directly every frame while Bulb Scroll
       is on for this ring (inline style always wins over this rule
       regardless of specificity), so this only actually applies before
       that first happens, or while Scroll is off (setBulbLoop explicitly
       sets the inline value to match this same base in that case too —
       see its own comment). Orbit motion is deliberately NOT a CSS
       @keyframes animation — see bulbOrbitTick's own comment (JS) for
       why: a negative animation-delay-based version of this worked
       until Bulb Speed needed to change on an already-running ring,
       which needed a periodic hard resync to stay in phase, which in
       turn caused a real browser-level artifact (reported live: the
       whole ring smoothly ramping down to a near-stop and back, timed
       exactly to the resync's own schedule) in how Chromium hands an
       offset-path animation off to the compositor after its
       custom-property-driven timing is touched. Recomputing every dot's
       position directly from one shared clock, every frame, sidesteps
       that category of problem entirely — there's no per-dot animation
       instance left to ever fall out of sync. */
    offset-distance: var(--marquee-bulb-dot-base, 0%);
    /* Flicker (opacity dips) is ALSO driven by bulbOrbitTick (JS), not
       a CSS @keyframes animation — a per-dot flicker animation sharing
       an element with bulbOrbitTick's own per-frame offsetDistance
       writes was reported live to visibly drift out of phase between
       dots over time (dozens of small independently-drifting dots made
       it obvious in a way the original 4 large edge strips never
       showed). See bulbOrbitTick's own comment (JS) for the full
       history. This rule intentionally sets no animation-* properties
       at all — opacity is plain inline style, written directly by that
       same shared-clock loop. */
  }
  /* Not scoped to .ticker — every element wears this class directly on
     its own .obj container (see applyDecorativeBulbs()/applyBulbFrame),
     ticker or not.
     Direct-child combinator (>), NOT a plain descendant selector — see
     editor.html's matching comment: #stage can also carry
     marquee-bulbs-active now, and every element's own dots live inside
     #stage too, so a plain descendant selector matched them as soon as
     #stage had the class regardless of that element's own state. */
  .marquee-bulbs-active > .marquee-bulb-dot {
    display: block;
  }
  /* The LAYOUT ring specifically (direct children of #stage, not a
     per-element ring nested inside some .obj) — same root cause as
     .stage::after's own z-index comment: these dots have no explicit
     z-index of their own, so they sit at the default "auto" stacking
     level, and every .obj gets an explicit positive z-index from
     applyOrder(), which always paints above "auto" regardless of DOM
     order. Reported live (on the earlier edge-strip version of this
     ring): the layout ring painting BEHIND Album Art. Set above
     .stage::after's own 10001 (itself above confetti's 10000) since the
     layout ring is meant to be the topmost thing, full stop — not just
     above .obj's own ordering range. Scoped with the direct-child
     combinator so a per-element ring (inside some .obj) is unaffected
     and keeps its own element's stacking order. */
  #stage > .marquee-bulb-dot {
    z-index: 10002;
  }
  /* Irregular dip points (not an even pulse) so it reads as an actual
     flickering bulb rather than a smooth breathing glow — reproduced in
     JS (isFlickerDipAt in render-core.js) rather than a CSS @keyframes
     rule now; see bulbOrbitTick's own comment for why. Intensity scales
     how deep the dips go — 0 stays effectively invisible, 1 dips all
     the way to off. */
  @media (prefers-reduced-motion: reduce) {
    .ticker.is-overflowing .ticker-track { animation: none; }
    .ticker.marquee-scroll-active .ticker-track { animation: none; }
    .ticker.marquee-stars-active .marquee-copy::after { animation: none; opacity: 0.7; }
    .ticker.marquee-stars-active .marquee-star-separator { animation: none; opacity: 0.7; }
    /* Bulb flicker isn't a CSS animation anymore (see bulbOrbitTick's
       own comment, JS) — its own reducedMotion check there is what
       actually suppresses it now, nothing left to do here. */
  }

  .obj-stat { width: max-content; }
  /* align-self:center: width:max-content means the .obj default
     align-items:stretch can't stretch this to the box's width. Plain,
     non-scrolling caption text, so centering the box itself is correct
     (everything else here wraps a .ticker and centers via that instead). */
  .stat-label { display: block; width: max-content; align-self: center; font-size: var(--element-head-size, 10px); letter-spacing: 0.14em; text-transform: uppercase; color: var(--header-text-color); font-weight: 700; white-space: nowrap; }
  .stat-value {
    display: block;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 0.98em;
    color: var(--text-color);
  }

  .stat-value-percent {
    display: block;
    font-variant-numeric: tabular-nums;
    font-weight: 900;
    font-size: 1.65em;
    line-height: 1.05;
    /* See MarqueeCore.applyScoreColor's own comment (render-core.js) —
       falls back to plain --accent before the first score update lands. */
    color: var(--score-color, var(--accent));
  }
  .stat-value-prev {
    /* Disabled per request (2026-07-20), alongside the val-prev JS below
       — not working correctly, and the underlying FeedBack stats/scoring
       code this depends on is expected to be reworked soon. Revert to
       `display: block;` (and re-enable the two commented lines in
       applyLiveState's score block) to bring it back. */
    display: none;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 0.7em;
    color: var(--paper-dim);
    margin-top: 2px;
  }

  .obj-progress { width: 240px; display: flex; flex-direction: row; align-items: center; gap: 8px; }
  /* Horizontal padding keeps the elapsed/duration values from sitting
     flush against .obj-progress's own edge — the box only has 1px of its
     own padding (see .obj), not enough room before the border ring, so the
     time text was getting visually clipped/crowded against it. */
  .time { font-variant-numeric: tabular-nums; font-size: 0.7em; color: var(--paper-dim); font-weight: 600; flex: 0 1 auto; min-width: 0; padding: 0 6px; }
  .progress-track { flex: 1; height: 3px; background: rgba(243, 233, 216, 0.14); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--bulb-hot)); transition: width 0.2s linear; }

  .obj-custom { width: max-content; }
  .custom-text { display: block; font-size: 0.9em; font-weight: 600; color: var(--text-color); }

  /* Same rule as the editor's own canvas — above every element's own
     z-index range, pointer-events:none so it's purely visual. Confetti
     never existed in the OBS-facing output before this — the original
     static render page this file's CSS/structure started as a copy of
     (see this file's own header comment for how it's since diverged)
     never had it either; it was editor-preview-only. */
  .confetti-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10000;
    /* OBS's Browser Source renders via CEF's off-screen rendering (OSR)
       mode, which is documented to sometimes miss repaints that are
       canvas-only (a rAF loop with no accompanying DOM/text mutation) —
       live-verified this round: the exact same event/canvas pipeline
       renders correctly in a real Chrome tab hitting this same render
       URL (screenshot-confirmed), so the code isn't the problem; this is
       a known OSR limitation. Forcing the canvas onto its own GPU
       compositing layer is the standard workaround — it nudges Chromium
       to track it as an independent paint target instead of relying on
       OSR's dirty-rect diffing to notice canvas-internal changes. */
    transform: translateZ(0);
    will-change: transform;
  }

  /* No synthetic bold/italic, anywhere — see editor.html's matching
     comment. Removed per direct request (2026-08-05): a font with no real
     bold/italic face now does nothing visually instead of the browser (or
     the old -webkit-text-stroke trick) faking one. */
  .obj, .obj * { font-synthesis: none !important; }
  /* Scoped to .obj AND every descendant (the trailing `*`), not a list of
     specific text-class names. font-weight etc. are inherited properties,
     but several descendants (.artist, .eyebrow-standalone, .stat-value,
     .custom-text, ...) already set their OWN explicit font-weight for
     their normal look — an explicit value on the element itself always
     wins over an inherited one regardless of !important, since importance
     only decides between rules that target the SAME element. Matching
     every descendant directly, not just .obj, is what actually forces
     the override through — and it's what makes this reach any future
     element's text automatically, with no new selector to add here. */
  .bold-active .obj,
  .bold-active .obj * {
    font-weight: 900 !important;
  }
  /* Per-element Bold override — see editor.html's matching comment. */
  .obj.style-override-bold-on,
  .obj.style-override-bold-on * {
    font-weight: 900 !important;
  }
  .obj.style-override-bold-off,
  .obj.style-override-bold-off * {
    font-weight: normal !important;
  }
  /* Italic/Underline — see editor.html's matching comment. */
  .italic-active .obj,
  .italic-active .obj * {
    font-style: italic !important;
  }
  .obj.style-override-italic-on,
  .obj.style-override-italic-on * {
    font-style: italic !important;
  }
  .obj.style-override-italic-off,
  .obj.style-override-italic-off * {
    font-style: normal !important;
  }
  .underline-active .obj,
  .underline-active .obj * {
    text-decoration: underline !important;
  }
  .obj.style-override-underline-on,
  .obj.style-override-underline-on * {
    text-decoration: underline !important;
  }
  .obj.style-override-underline-off,
  .obj.style-override-underline-off * {
    text-decoration: none !important;
  }

  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  body { display: block; background: transparent; }
  .stage { width: 100vw; height: 100vh; }

  /* Connection-lost indicator — invisible in normal operation; a small dot
     so a streamer glancing at their preview can tell live data stalled
     instead of silently freezing on the last-known values. */
  #conn-dot {
    position: fixed; top: 6px; left: 6px; width: 8px; height: 8px; border-radius: 50%;
    background: #e0453c; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  #conn-dot.stale { opacity: 0.9; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- Reported live: "nothing should be visible at all" when the overlay
       fades out — this was previously a SIBLING of .stage, not a child,
       so it never faded with everything else (CSS opacity on an ancestor
       DOES apply to descendants even when they're position:fixed like
       this one — only its on-screen coordinates stay viewport-relative,
       not whether it's covered by an ancestor's opacity). Moved inside so
       it's covered by the exact same fade as everything else. -->
  <div id="conn-dot" aria-hidden="true"></div>
  <div class="stage-canvas-bg" aria-hidden="true"></div>

  <div class="obj obj-art" id="obj-art" data-id="art">
    <img class="art-img" id="art-img" alt="Album art" draggable="false" />
    <span class="art-frame-line" aria-hidden="true"></span>
  </div>

  <div class="obj obj-stat" id="obj-path" data-id="path">
    <span class="stat-label">Path</span>
    <span class="stat-value"><span class="ticker"><span class="ticker-track" id="val-path">—</span></span></span>
  </div>

  <div class="obj obj-label" id="obj-nowplaying" data-id="nowplaying">
    <span class="eyebrow-standalone"><span class="ticker"><span class="ticker-track">Now Playing</span></span></span>
  </div>

  <div class="obj obj-info" id="obj-info" data-id="info">
    <h2 class="title"><span class="ticker"><span class="ticker-track" id="val-title">—</span></span></h2>
    <p class="artist"><span class="ticker"><span class="ticker-track" id="val-artist">—</span></span></p>
  </div>

  <div class="obj obj-stat" id="obj-tuning" data-id="tuning">
    <span class="stat-label">Tuning</span>
    <span class="stat-value"><span class="ticker"><span class="ticker-track" id="val-tuning">—</span></span></span>
  </div>

  <div class="obj obj-stat" id="obj-year" data-id="year">
    <span class="stat-label">Year</span>
    <span class="stat-value"><span class="ticker"><span class="ticker-track" id="val-year">—</span></span></span>
  </div>

  <div class="obj obj-stat" id="obj-score" data-id="score">
    <span class="stat-label">Score</span>
    <span class="stat-value-percent"><span class="ticker"><span class="ticker-track" id="val-score">—</span></span></span>
    <span class="stat-value-prev"><span class="ticker"><span class="ticker-track" id="val-prev">&nbsp;</span></span></span>
  </div>

  <div class="obj obj-progress" id="obj-progress" data-id="progress">
    <span class="time"><span class="ticker"><span class="ticker-track" id="val-time-elapsed">0:00</span></span></span>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="time"><span class="ticker"><span class="ticker-track" id="val-time-duration">0:00</span></span></span>
  </div>

  <div class="obj obj-stat" id="obj-album" data-id="album">
    <span class="stat-label">Album</span>
    <span class="stat-value"><span class="ticker"><span class="ticker-track" id="val-album">—</span></span></span>
  </div>

  <canvas class="confetti-canvas" id="confettiCanvas" aria-hidden="true"></canvas>
</div>

<script src="render-core.js"></script>
<script src="presets/standard.js"></script>
<script>
  // See body.embedded's own CSS comment — only true when editor.html's
  // live-render-preview iframe loads this page; a real OBS Browser Source
  // always loads it top-level.
  if (window.self !== window.top) {
    document.documentElement.classList.add('embedded');
    document.body.classList.add('embedded');
  }
  // Step 3 of the editor/render consolidation: instant preview. Normally
  // this page only learns about a layout/visuals change once the editor
  // autosaves it to the backend and its own WebSocket connection echoes
  // that back (AUTOSAVE_INTERVAL_MS later) — fine for the real OBS
  // output, but it made dragging/resizing/style edits in the editor feel
  // disconnected from what its own live preview showed. editor.html's
  // schedulePreviewPost() (see its own comment) posts the CURRENT
  // in-memory, possibly-still-unsaved layout/visuals straight to this
  // page's contentWindow on every change. Deliberately calls renderLayout
  // directly, not applyLiveState — this is layout/visuals ONLY (no
  // song/position/score), so routing it through applyLiveState would
  // feed `state.song`/`state.preview` as undefined on every single edit,
  // making updateVisibility() treat that as "nothing playing" and
  // fade the preview out mid-edit; the real WS connection (still running
  // in parallel, untouched by any of this) stays the only thing driving
  // song content/visibility. ev.source, not ev.origin — checking WHICH
  // window sent it (must be this iframe's own parent) rather than
  // filtering by a specific origin string this script has no reliable
  // way to know in advance; a message from anywhere else is silently
  // ignored, same trust posture as this being a same-origin embed in
  // practice.
  window.addEventListener('message', (ev) => {
    if (ev.source !== window.parent) return;
    if (!ev.data || ev.data.type !== 'marquee-preview-layout' || !ev.data.data) return;
    try { renderLayout(ev.data.data); } catch (e) { /* malformed draft — ignore, next real update will correct it */ }
  });
  // ---- LAYOUT_DATA: position/size/visuals only — paste an export from the
  // editor over this object to change where things sit. CONTENT (song
  // title, score, ...) is never part of
  // this object here — that's supplied live over WebSocket. Currently
  // baked in: the Standard preset's defaults.
  //
  // IMPORTANT — set OBS's Browser Source Width/Height to EXACTLY match
  // visuals.stageWidth/stageHeight below (520x200 for this default).
  // Sourced from presets/standard.js (defaultLayout/defaultVisuals),
  // loaded via <script src> above — the same file editor.html's own
  // Standard preset uses, so there's one shared copy between the two HTML
  // pages instead of an independently hand-maintained duplicate here.
  // Deep-cloned rather than referenced live, matching how editor.html
  // always treats this data as a template, not something to mutate.
  const LAYOUT_DATA = {
    version: 1,
    order: Object.keys(defaultLayout),
    elements: JSON.parse(JSON.stringify(defaultLayout)),
    visuals: JSON.parse(JSON.stringify(defaultVisuals)),
  };

  // Latest visuals object, kept at module scope — fireConfetti() (below)
  // needs confettiEnabled/Duration/Volume/TriggerAt, but `visuals` itself
  // only exists inside renderLayout()'s own closure.
  let lastVisuals = LAYOUT_DATA.visuals;
  // Same idea, for per-element overrides — applyLiveState() (song update
  // tick, runs far more often than a full layout re-render) needs to
  // resolve ONE element's (info's) effective marqueeScroll, but
  // layout/getEffectiveVisualsFor only exist inside renderLayout()'s own
  // closure too.
  let lastLayout = LAYOUT_DATA.elements;
  // effectiveFor deleted — it was a second, narrower reimplementation of
  // getEffectiveVisualsFor's override-resolution logic, needed only
  // because the real one used to be trapped inside renderLayout()'s own
  // closure. Now that MarqueeCore.getEffectiveVisualsFor is a real,
  // always-callable shared function, its two call sites below use that
  // directly instead.
  // MARQUEE_BULB_EPOCH moved into render-core.js (MarqueeCore.BULB_EPOCH)
  // — created once when that script loads, giving this document the
  // same one-time-per-page-load semantics it always needed.

  // ── layout/visuals renderer — same logic as the original static render page,
  // now a reusable named function instead of a run-once IIFE: the editor
  // (assets/editor.html) can save a new layout at
  // any time, and this gets re-invoked live via the WebSocket below so an
  // already-open OBS Browser Source picks it up without a refresh. ──
  function renderLayout(data) {
    const root = document.documentElement;
    const stage = document.getElementById('stage');
    const layout = data.elements;
    const order = data.order;
    const visuals = data.visuals;
    // Per-element visual overrides — globalFallbackFor/hexToRgbChannels/
    // getEffectiveVisualsFor/applyElementStyleOverrides/
    // applyAllElementStyleOverrides moved into render-core.js
    // (MarqueeCore.*), shared with editor.html instead of duplicated.
    // Captured BEFORE lastVisuals/lastLayout are overwritten below —
    // setBulbLoop() only ever sets a dot's _bulbFlickerOffsetMs ONCE
    // (see its own comment), so flipping
    // Bulb Flicker Random (globally, or via any one element's own
    // override) needs an explicit forced resync afterward
    // (resyncAllBulbDelays()); without detecting the flip here, that
    // guard would just as correctly (and unhelpfully) protect the new
    // mode from ever taking effect on anything already running. Checked
    // per-element (not just the global flag) because an element's own
    // override can flip its EFFECTIVE value independently of Global.
    const bulbFlickerRandomChanged = Object.keys(layout).some((id) =>
      !!MarqueeCore.getEffectiveVisualsFor(lastLayout, lastVisuals, id).marqueeBulbFlickerRandom
        !== !!MarqueeCore.getEffectiveVisualsFor(layout, visuals, id).marqueeBulbFlickerRandom);
    lastVisuals = visuals;
    lastLayout = layout;

    // A re-apply (not the first call) may be dropping/renaming custom text
    // or Marquee Roll elements the previous layout had — clear them all
    // and let the "build custom/roll elements" step below recreate
    // whatever the NEW data actually contains, same as the editor's own
    // importState() does on every import rather than trying to diff old
    // vs. new ids. Reported live (only ever showing up inside FeedBack,
    // never when just testing the editor's own canvas preview — because
    // editor.html's loadPresetState already has its own removal step for
    // this, see its own comment): switching a preset that had a Roll to
    // one that didn't left that Roll's DOM element behind forever — the
    // per-id loops below only ever touch ids present in the CURRENT
    // layout, so an orphaned id from a previous layout is simply never
    // looked at again, staying fully visible with its last content
    // alongside whatever the new preset renders. .obj-custom already got
    // this treatment; .obj-roll needed the identical fix.
    document.querySelectorAll('.obj-custom').forEach((el) => el.remove());
    document.querySelectorAll('.obj-roll').forEach((el) => el.remove());

    // NAME_SYNC_SELECTOR/syncElementName moved into render-core.js
    // (MarqueeCore.*) — shared with editor.html instead of duplicated.

    // Both ticker modes need to agree on what the "real" single-copy
    // text is, whether or not a previous marquee-mode setup call has
    // since duplicated it into repeated .marquee-copy children — plain
    // track.textContent would return every copy concatenated together
    // in that case. Read from the first copy if present, else the
    // track's own (plain) text; collapse back to that single plain text
    // node either way, since both bounce mode and a fresh marquee
    // rebuild need to start from one clean copy.
    // resetTrackToPlainText/setupBounceTicker moved into render-core.js
    // (MarqueeCore.*) — shared with editor.html instead of duplicated.
    // Continuous, seamlessly-looping marquee-sign crawl — see the
    // .marquee-scroll-active CSS comment for the full rationale.
    // Reported live: waiting for one instance to fully exit before the
    // next one enters left the ticker empty for a stretch of every
    // loop; fixed by duplicating the text into enough repeated copies
    // (gap scales with font size, so it stays proportional at small
    // element sizes too) that translating left by exactly one copy's
    // width + gap is visually indistinguishable from the start
    // position — the next copy is always already chasing the tail of
    // the one ahead of it. Removes+reflows+re-adds the class rather
    // than just updating the custom properties on an already-running
    // animation, so a text/size change restarts cleanly instead of the
    // browser carrying old positions into new keyframe values.
    // MARQUEE_SCROLL_PX_PER_SEC_DEFAULT moved into render-core.js
    // (used internally by MarqueeCore.runMarqueeScrollTicker).
    // MARQUEE_BULB_SIZE_DEFAULT/MARQUEE_BULB_GAP_DEFAULT/
    // MARQUEE_BULB_LAYOUT_FRAME_INSET_PX/MARQUEE_BULB_SPEED_DEFAULT/
    // MARQUEE_BULB_FLICKER_DURATION_MS and setBulbLoop/
    // resyncAllBulbDelays/resyncElementBulbDelay/applyBulbFrame/
    // applyDecorativeBulbs, plus the bulb-loop ResizeObserver itself, all
    // moved into render-core.js (MarqueeCore.*) — shared with editor.html
    // instead of duplicated. This also fixes a real (if minor) bug: this
    // observer used to be recreated fresh on every single renderLayout()
    // call (every autosave tick), rather than the true one-time,
    // module-scope instance it's now.
    //
    // runMarqueeScrollTicker/buildPlainScrollCopy/setupMarqueeScrollTicker/
    // setupTicker moved into render-core.js (MarqueeCore.*) too — shared
    // with editor.html instead of duplicated. This is also where the
    // three window._marquee* escape hatches (_marqueeSetupTicker,
    // _marqueeSetupAllTickers, _marqueeResolveRollGroups) used to get
    // reassigned — deleted entirely below (see the sibling functions that
    // used to read them), since MarqueeCore's functions are real,
    // always-callable module functions now, not per-renderLayout()-call
    // closures with nothing reachable from outside them.
    // ============================================================
    // Marquee Scroll Roll: resolves each element's own rollGroup/
    // rollSlot assignment (set via each element's own settings in the
    // editor, not any geometry) into the matching Roll element's
    // combined ticker text. Only elements with a real ticker contribute
    // — Album Art has no text to add. Real member elements are hidden
    // while assigned to an existing Roll; the Roll itself is a real,
    // user-positioned element built once (see buildRollElementDom /
    // order.forEach in renderLayout), fed through the same
    // setupLinkScrollTicker/setupBounceTicker every other combined
    // ticker uses.
    // ============================================================
    // isLinkableElement/isHiddenWithinObj/getElementLinkText/
    // MARQUEE_LINK_SEPARATOR/MARQUEE_LINK_SEPARATOR_PLAIN/
    // buildLinkSegmentSpan/setupLinkScrollTicker/resolveRollGroups/
    // setupAllTickers all moved into render-core.js (MarqueeCore.*) —
    // shared with editor.html instead of duplicated. render.html needs
    // no extra behavior beyond what MarqueeCore.setupAllTickers already
    // does, so there's no local wrapper here at all — every caller below
    // uses MarqueeCore.setupAllTickers/resolveRollGroups directly. This
    // is also what finally lets window._marqueeSetupAllTickers and
    // window._marqueeResolveRollGroups be deleted entirely (their two
    // remaining read sites now call the real functions directly, using
    // lastLayout/lastVisuals since they run outside renderLayout()).

    function buildCustomElementDom(id, text) {
      const el = document.createElement('div');
      el.className = 'obj obj-custom';
      el.id = 'obj-' + id;
      const textWrap = document.createElement('span');
      textWrap.className = 'custom-text';
      textWrap.appendChild(MarqueeCore.buildTickerTrack(text));
      el.appendChild(textWrap);
      return el;
    }
    // A Marquee Roll element — reuses .stat-value's styling (bold,
    // tabular-nums) for its single ticker, same as every other value
    // display. Its content is populated by resolveRollGroups() below,
    // not here — this only ever builds the empty shell the FIRST time a
    // given roll id shows up in the layout data.
    function buildRollElementDom(id) {
      const el = document.createElement('div');
      el.className = 'obj obj-stat obj-roll';
      el.id = 'obj-' + id;
      el.appendChild(MarqueeCore.buildRollValueShell());
      return el;
    }
    order.forEach((id) => {
      const pos = layout[id];
      if (pos && pos.custom && !document.getElementById('obj-' + id)) {
        stage.appendChild(buildCustomElementDom(id, pos.text || ''));
      }
      if (pos && pos.isRoll && !document.getElementById('obj-' + id)) {
        stage.appendChild(buildRollElementDom(id));
      }
    });

    Object.keys(layout).forEach((id) => {
      const pos = layout[id];
      const el = document.getElementById('obj-' + id);
      if (!el) return;
      el.style.left = pos.x + '%';
      el.style.top = pos.y + '%';
      el.style.display = pos.visible === false ? 'none' : '';
      if ('scale' in pos) {
        el.style.transform = 'scale(' + (pos.scale || 1) + ')';
        // See --art-scale's :root comment — keeps the bulb frame's
        // effective size correct regardless of how zoomed the art is.
        el.style.setProperty('--art-scale', String(pos.scale || 1));
      } else {
        el.style.width = pos.width ? pos.width + 'px' : '';
        el.style.height = pos.height ? pos.height + 'px' : '';
        // Text size no longer set here — see editor.html's matching
        // comment; .obj reads --element-text-size instead now.
      }
    });
    // Re-applies every element's own per-element overrides — needed on
    // every call, not just once, since a freshly-created element's
    // inline style starts empty regardless of what layout[id].styleOverrides
    // already says (see editor.html's matching comment on applyLayout).
    MarqueeCore.applyAllElementStyleOverrides(layout, visuals);
    Object.keys(MarqueeCore.NAME_SYNC_SELECTOR).forEach((id) => MarqueeCore.syncElementName(id, layout, visuals));

    order.forEach((id, i) => {
      const el = document.getElementById('obj-' + id);
      if (el) el.style.zIndex = String(order.length - i);
    });

    // --stage-w-px/--stage-ratio were, until now, ONLY EVER their static
    // :root defaults (520px / 520:200) — nothing in this file ever set
    // them from live data, unlike editor.html's own applyStageSize(),
    // which does this every time. That was invisible for the real OBS
    // Browser Source specifically, because THAT case is governed by a
    // completely different, later rule (search "width: 100vw" below) that
    // fills .stage to the full viewport OBS itself sizes the page to —
    // --stage-w-px/-ratio simply never mattered there, real or not.
    // Embedded mode (see body.embedded's own comment) is the one case
    // that actually depends on these two properties tracking live data,
    // since it removes the min(...,94vw) cap that used to (coincidentally)
    // bound Standard-ish sizes — which is what exposed this gap: reported
    // live as "the iframe box is the right size/shape, but its CONTENT is
    // wrong" on every preset except Standard (300x150 Small, 300x520
    // Tall, ... all rendered as if they were still 520x200, because
    // nothing had ever set --stage-w-px to anything else). Setting these
    // here — the same two properties editor.html's applyStageSize() sets,
    // from the same visuals fields — fixes the embedded preview for every
    // preset. Real OBS output is unaffected either way.
    if (typeof visuals.stageWidth === 'number' && Number.isFinite(visuals.stageWidth)) {
      root.style.setProperty('--stage-w-px', visuals.stageWidth + 'px');
    }
    if (typeof visuals.stageWidth === 'number' && typeof visuals.stageHeight === 'number'
      && Number.isFinite(visuals.stageWidth) && Number.isFinite(visuals.stageHeight)) {
      root.style.setProperty('--stage-ratio', visuals.stageWidth + ' / ' + visuals.stageHeight);
    }
    if (visuals.accentRgb) root.style.setProperty('--accent-rgb', visuals.accentRgb);
    if (visuals.accent) root.style.setProperty('--accent', visuals.accent);
    if (visuals.textColor) root.style.setProperty('--text-color', visuals.textColor);
    if (visuals.headerTextColor) root.style.setProperty('--header-text-color', visuals.headerTextColor);
    if (visuals.chipRgb) root.style.setProperty('--chip-rgb', visuals.chipRgb);
    if (typeof visuals.chipAlpha === 'number') root.style.setProperty('--chip-alpha', String(visuals.chipAlpha));
    if (typeof visuals.borderWidth === 'number') root.style.setProperty('--border-width', visuals.borderWidth + 'px');
    if (typeof visuals.elementHeadSize === 'number') root.style.setProperty('--element-head-size', visuals.elementHeadSize + 'px');
    if (typeof visuals.elementTextSize === 'number') root.style.setProperty('--element-text-size', visuals.elementTextSize + 'px');
    if (typeof visuals.edgeRounding === 'number') root.style.setProperty('--edge-rounding', visuals.edgeRounding + 'px');
    if (visuals.canvasBgRgb) root.style.setProperty('--canvas-bg-rgb', visuals.canvasBgRgb);
    if (typeof visuals.canvasBgAlpha === 'number') root.style.setProperty('--canvas-bg-alpha', String(visuals.canvasBgAlpha));
    if (visuals.font) root.style.setProperty('--font-display', '"' + visuals.font + '", "Segoe UI", Arial, sans-serif');
    if (typeof visuals.fadeSeconds === 'number') root.style.setProperty('--fade-seconds', visuals.fadeSeconds + 's');
    // marqueeBulbSize/marqueeBulbGap drive setBulbLoop() directly (see its
    // own comment) — no CSS custom property involved, so nothing to set
    // here.
    // Field is still named marqueeSparkleSize (not marqueeStarSize) —
    // this is what's persisted in saved layout files, and renaming it
    // would silently drop the setting for anyone with an existing save;
    // only the CSS var/classes and the UI label moved to "star"
    // terminology. 'px', not 'em' — see the --marquee-star-size CSS
    // comment for why this used to render a different size on every
    // element.
    if (typeof visuals.marqueeSparkleSize === 'number') root.style.setProperty('--marquee-star-size', visuals.marqueeSparkleSize + 'px');
    document.body.classList.toggle('bold-active', !!visuals.bold);
    document.body.classList.toggle('italic-active', !!visuals.italic);
    document.body.classList.toggle('underline-active', !!visuals.underline);

    MarqueeCore.setupAllTickers(layout, visuals);
    // OBS Browser Source is a fresh CEF navigation every time the source is
    // added/the cache is cleared — the very first renderLayout() pass can
    // land before the chosen font (visuals.font, a LOCAL system font, not a
    // web font — see editor.html's queryLocalFonts) has actually finished
    // loading into that process. setupAllTickers() above measures real text
    // width (scrollWidth/clientWidth) to decide overflow/bounce/Marquee
    // Scroll behavior and duration, so a too-early measurement — taken
    // against the fallback font before the real one swaps in — bakes in
    // wrong alignment/sizing that never self-corrects until something
    // forces a fresh layout pass (manually refreshing the source, which by
    // then has the font warm). Re-running the measurement once the font
    // actually finishes loading fixes it automatically instead of relying
    // on a manual refresh. Cheap no-op if fonts were already loaded before
    // this point (the common case on a long-running source).
    if (document.fonts && document.fonts.status !== 'loaded') {
      document.fonts.ready.then(() => MarqueeCore.setupAllTickers(layout, visuals));
    }
    // Forced resync, only on the exact tick Bulb Flicker Random actually
    // flipped — every element abandons whatever delay it's currently
    // running with and recomputes fresh under the new mode (random
    // picks a fresh offset per element; turning it back off resyncs
    // everyone to the shared epoch again). See resyncAllBulbDelays().
    if (bulbFlickerRandomChanged) MarqueeCore.resyncAllBulbDelays(layout, visuals);
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => MarqueeCore.setupAllTickers(lastLayout, lastVisuals), 150);
  });

  // ── live content layer (this is what's new vs. the design-tool export) ──
  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  // A perfect run showed "100.00%" — reported as wanting a clean "100%"
  // instead, same as it used to show; every other value keeps its 2
  // decimal places (94.32%, etc.), just this one boundary case doesn't.
  function fmtPct(frac) {
    const pct = frac * 100;
    return (pct >= 100 ? '100' : pct.toFixed(2)) + '%';
  }
  // "E Standard" / "Standard" / "Standard Eb" -> "E STD" / "STD" / "STD Eb"
  // — whatever's around the word "Standard" is left alone, only that one
  // word gets abbreviated. Case-insensitive so it still catches it
  // regardless of how displayTuningName happens to capitalize it.
  function abbreviateTuning(text) {
    return text ? String(text).replace(/standard/gi, 'STD') : text;
  }
  // setText now reports whether the text actually changed, and callers
  // only re-measure the specific ticker that changed — not every ticker on
  // the page — on every update. It used to call
  // window._marqueeSetupAllTickers() unconditionally at the end of
  // applyLiveState, which ran on every single state update including
  // plain position ticks (every ~250ms while playing). That reset EVERY
  // ticker's scroll animation (removes .is-overflowing, clears
  // --ticker-shift/animation-duration, remeasures, re-adds) 4 times a
  // second regardless of whether that ticker's own text had changed at
  // all — the CSS animation needs several seconds to complete one visible
  // pass (Math.max(4, overflow/28)s), so constantly restarting it before
  // it ever visibly progressed produced exactly the reported symptom:
  // "sometimes they don't scroll, other times they do." Reported live,
  // root-caused by inspection (this dev environment had no live song to
  // reproduce it against directly).
  function setText(id, text) {
    const el = document.getElementById(id);
    if (!el) return false;
    const newText = (text === null || text === undefined || text === '') ? '—' : String(text);
    if (el.textContent === newText) return false;
    el.textContent = newText;
    return true;
  }
  // A ticker already actively animating (bounce-on-overflow, or Marquee
  // Scroll) gets its displayed text swapped in place here instead of
  // going through setupTicker — that function measures/rebuilds from
  // scratch and (Marquee Scroll especially) restarts the CSS animation
  // from position 0, which is fine for text that changes occasionally
  // (a new song's title/tuning/path/year/album) but was resetting Score's
  // live accuracy and Song Time's elapsed clock — both of which update
  // continuously while a song plays — before their multi-second scroll
  // ever completed a single visible pass. Reported live as Score's
  // Marquee Scroll showing as a static, non-scrolling value; confirmed by
  // sampling the track's own transform live (CDP) — it was being reset to
  // 0 roughly every ~500ms (screen.js's own resync interval), the same
  // "restarted before it ever visibly progressed" root cause setText's
  // own comment above already root-caused for the general case, just not
  // yet covering ids whose text is DIFFERENT on every single update
  // rather than only occasionally. Text not yet actively animating still
  // goes through the normal measure-and-maybe-animate path below, since a
  // fresh rebuild is exactly what's needed for text that might newly
  // start overflowing/scrolling.
  function setTextAndReticker(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    const newText = (text === null || text === undefined || text === '') ? '—' : String(text);
    const ticker = el.closest('.ticker');
    if (ticker && ticker.classList.contains('marquee-scroll-active')) {
      const track = ticker.querySelector('.ticker-track');
      const copies = track ? track.querySelectorAll('.marquee-copy:not(.marquee-link-copy)') : [];
      if (copies.length > 0) copies.forEach((c) => { c.textContent = newText; });
      else if (track) track.textContent = newText;
      return;
    }
    if (ticker && ticker.classList.contains('is-overflowing')) {
      // Swapping text in place (no rebuild) is what protects Score/Song
      // Time's continuous updates — see this function's own comment. But
      // bounce mode's --ticker-shift/animation-duration are computed from
      // the OLD text's overflow width and were never being recomputed
      // here at all: fine when the new text overflows by roughly the same
      // amount (a fractional Score tick), wrong when it doesn't (a new
      // song's title is rarely the same length as the last one) — the
      // ticker kept animating with a shift sized for different text,
      // visibly overshooting/snapping to the wrong position. Reported
      // live as the title "scrolling all the way to the left," only in
      // OBS, intermittent, fixed by refreshing the source with no
      // FeedBack-side change — exactly what a stale shift computed for a
      // previous title, still applied after the title changed, looks
      // like. Measuring the actual new overflow and only rebuilding
      // (setupTicker, which measures fresh AND picks bounce vs. Marquee
      // Scroll correctly) when it's genuinely different keeps both cases
      // working: a real content change gets a correct fresh shift/
      // duration, a near-identical continuous tick still skips the
      // rebuild and keeps animating uninterrupted.
      const oldShift = Math.abs(parseFloat(el.style.getPropertyValue('--ticker-shift')) || 0);
      el.textContent = newText;
      const newOverflow = Math.max(0, el.scrollWidth - ticker.clientWidth);
      // A bare setupTicker(ticker) call here used to be a ReferenceError
      // (setupTicker only existed inside renderLayout()'s own closure,
      // not at this function's module-level sibling scope) — the actual
      // root cause behind the score/timer "freeze" bug (every score/
      // timer tick whose overflow shifted by more than 4px threw here,
      // uncaught, aborting whatever else applyLiveState() still had left
      // to do in that same WS message). Now that MarqueeCore.setupTicker
      // is a real, always-callable function (not a per-call closure),
      // there's no separate closure reference to miss — using
      // lastLayout/lastVisuals since this function runs outside
      // renderLayout() entirely.
      if (Math.abs(newOverflow - oldShift) > 4) MarqueeCore.setupTicker(ticker, lastLayout, lastVisuals);
      return;
    }
    if (!setText(id, text)) return;
    MarqueeCore.setupTicker(ticker, lastLayout, lastVisuals);
  }

  let lastArtUrl = null;
  let lastLayoutJSON = null;
  let lastScoreSongKey = null;

  // Whole-overlay fade — visible whenever a real song is LOADED (playing
  // OR paused), or while the editor has an active preview heartbeat going
  // (state.preview — see routes.py) so a streamer can see real
  // positioning in OBS while adjusting the layout without a song playing.
  // Invisible only when nothing is loaded at all.
  //
  // Earlier version keyed this off state.playing instead of state.song —
  // reported live: that made a plain pause mid-song trigger the same fade
  // as actually leaving the player, which is wrong: pausing to talk to
  // chat shouldn't hide the now-playing overlay, only actually finishing/
  // leaving the song should. state.song is only ever cleared on a genuine
  // song:loaded of nothing, or screen:changed away from the player (see
  // screen.js) — never on a plain pause.
  // Starts false, not null — the stage's CSS default (opacity 0, no
  // .stage-visible class) already IS "not visible," so there's nothing to
  // apply on boot if the first computed value is also false (no song/
  // preview yet); starting at null would treat that as a real transition
  // and needlessly run the confetti-wait sequence (see beginFadeOutSequence)
  // for nothing to actually change.
  let lastVisible = false;
  // visuals.fadeEnabled (editor toggle, defaults true when absent — old
  // saved layouts predate this field) — false is "Always Show": the stage
  // is forced permanently visible regardless of state.song/state.preview,
  // never fading out at all. The content-freezing behavior right below in
  // applyLiveState (the `if (song) { ... }` block does nothing when there's
  // no song) already keeps showing the last real song's info, score
  // included, once nothing new is coming in — Always Show only needed to
  // stop the STAGE itself from disappearing on top of that.
  // Set true the instant the WS connection to FeedBack's own backend
  // drops (see connect()'s ws.onclose below) — overrides even
  // fadeEnabled:false ("Always Show"), since that setting means "don't
  // hide just because no song is loaded," not "keep showing FeedBack's
  // last output forever after FeedBack itself has closed." Cleared back
  // to false on reconnect, which immediately re-fetches real state
  // rather than waiting for the next organic broadcast (see ws.onopen).
  let connectionStale = false;
  // Set from the moment a fade-out is decided until it actually applies —
  // covers both the wait-for-song-ended below and, once confetti is
  // confirmed running, the wait for it to finish (a long confettiDuration,
  // e.g. 12s, with a shorter fadeSeconds, e.g. 6s, would otherwise start
  // fading the stage out mid-burst, cutting particles off visually).
  let pendingFadeOut = false;
  // Whether `song-ended` (see handleServerEvent — this is what decides if
  // confetti fires) has been seen for the song that's fading out right
  // now. Reset every time the stage goes visible again (a new song, or
  // preview). `song-ended` and the state broadcast that actually hides the
  // stage (see updateVisibility — typically a 'clear' sent when
  // screen:changed fires away from the player) are sent as two
  // INDEPENDENT requests from screen.js, with no guaranteed order or fixed
  // gap between them — a fixed short grace window here previously assumed
  // a same-moment 'ended' would always win a race within ~400ms, which
  // doesn't hold up against real-world latency (reported live: still
  // fading mid-confetti at 12s duration / 6s fade). Waiting for actual
  // confirmation instead of guessing a duration closes that gap
  // regardless of how large it turns out to be in practice.
  let songEndedSeen = false;
  const CONFETTI_WAIT_POLL_MS = 50;
  // Safety-net ceiling for the wait below — NOT how long a real
  // song-ended-with-confetti case ever actually waits (that resolves near
  // instantly, since `song-ended` fires synchronously the moment a song
  // finishes, well before FeedBack's own screen-change delay — 1.5s+ per
  // its own AUTO_EXIT_GRACE_MS — even starts, so songEndedSeen is already
  // true by the time a fade-out is ever decided). This ceiling only
  // matters when a song is exited WITHOUT ever naturally ending (manual
  // stop mid-song — no `song-ended` is coming at all, since it only fires
  // on genuine completion), where confetti was never possible either way.
  // Kept short rather than generous: reported live that an earlier, much
  // longer value (4000ms) added a real 4-second delay to every one of
  // those exits for zero benefit, since nothing was ever going to arrive.
  const CONFETTI_WAIT_TIMEOUT_MS = 300;
  function applyFadeOut() {
    const stage = document.getElementById('stage');
    // Fade OUT is otherwise untouched — .stage's own rule (see its CSS
    // comment) already handles holding at 100% then ramping to a true 0%.
    if (stage) stage.classList.remove('stage-visible');
  }
  function watchConfettiThenFadeOut() {
    if (!pendingFadeOut) return;
    if (MarqueeCore._confettiAnimId) {
      requestAnimationFrame(watchConfettiThenFadeOut);
      return;
    }
    pendingFadeOut = false;
    applyFadeOut();
  }
  function beginFadeOutSequence() {
    pendingFadeOut = true;
    const deadline = performance.now() + CONFETTI_WAIT_TIMEOUT_MS;
    function waitForEndedDecision() {
      // Visibility flipped back true (and cancelled this) in the meantime
      // — nothing to do.
      if (!pendingFadeOut) return;
      if (songEndedSeen || performance.now() >= deadline) {
        if (MarqueeCore._confettiAnimId) {
          watchConfettiThenFadeOut();
        } else {
          pendingFadeOut = false;
          applyFadeOut();
        }
        return;
      }
      setTimeout(waitForEndedDecision, CONFETTI_WAIT_POLL_MS);
    }
    waitForEndedDecision();
  }
  function updateVisibility(state) {
    const fadeEnabled = !lastVisuals || lastVisuals.fadeEnabled !== false;
    const visible = connectionStale ? false : (fadeEnabled ? !!(state.song || state.preview) : true);
    if (visible === lastVisible) return;
    lastVisible = visible;
    const stage = document.getElementById('stage');
    if (!stage) return;
    if (visible) {
      pendingFadeOut = false;
      songEndedSeen = false;
      // Fade IN starts from a 15% floor, not literally 0 — snap there
      // instantly (transition disabled, then a forced reflow commits it
      // with nothing animating yet) before re-enabling the transition and
      // adding .stage-visible, so the .stage.stage-visible rule's own
      // transition (see its CSS comment) carries it the rest of the way
      // from 15% up to 100%, instead of continuing from a literal 0%.
      stage.style.transition = 'none';
      stage.style.opacity = '0.15';
      void stage.offsetWidth;
      stage.style.transition = '';
      stage.style.opacity = '';
      stage.classList.add('stage-visible');
    } else if (!pendingFadeOut) {
      beginFadeOutSequence();
    }
  }

  function applyLiveState(state) {
    if (!state) return;

    // Layout/visuals changed (editor save, or the very first frame) — this
    // must run BEFORE the content updates below so the final ticker-sizing
    // pass measures text against the CURRENT layout, not a stale one.
    const layoutJSON = state.layout ? JSON.stringify(state.layout) : null;
    if (layoutJSON && layoutJSON !== lastLayoutJSON) {
      lastLayoutJSON = layoutJSON;
      renderLayout(state.layout);
    } else if (!layoutJSON && lastLayoutJSON === null) {
      // Nothing saved yet anywhere (fresh install) — fall back to the
      // built-in default so the stage isn't empty before anyone's opened
      // the editor even once.
      lastLayoutJSON = JSON.stringify(LAYOUT_DATA);
      renderLayout(LAYOUT_DATA);
    }

    updateVisibility(state);

    const preview = (!state.song && state.preview) ? state.preview : null;
    const song = state.song || (preview && preview.song);
    const position = state.song ? state.position : ((preview && preview.position) || { time: 0, duration: 0 });
    const score = state.song ? state.score : (preview && preview.score);

    const artImg = document.getElementById('art-img');

    // Reported live: text reset to "—" and the album art vanished almost
    // instantly (its own fade-in/out transition is a fixed 0.25s) the
    // moment a song ended, while the STAGE's own opacity fade was just
    // starting its much slower multi-second transition — content visibly
    // popping away well before the box around it had finished fading, an
    // obviously mismatched "global fade speed." Fix: when there's no
    // song/preview to show, this whole block now does nothing at all
    // instead of blanking everything — the last real content just stays
    // frozen exactly as it was, and visually disappears ONLY via the
    // stage's own opacity fade (updateVisibility above), at the exact
    // same rate as literally everything else on the stage, because it's
    // the same one CSS transition on the shared ancestor. Content is only
    // actually replaced once a new song (or preview) genuinely arrives.
    if (song) {
      // Marquee Scroll only: one line, "Artist - Song", in the title's
      // own large styling, instead of two separately-scrolling lines —
      // see the .info-combined-line CSS comment. val-artist's text stays
      // in sync either way (cheap, and means toggling back needs no
      // special re-fetch), only its visibility and val-title's content
      // change with the mode.
      const infoObj = document.getElementById('obj-info');
      const combinedInfo = !!MarqueeCore.getEffectiveVisualsFor(lastLayout, lastVisuals, 'info').marqueeScroll;
      if (infoObj) infoObj.classList.toggle('info-combined-line', combinedInfo);
      if (combinedInfo) {
        setTextAndReticker('val-title', [song.artist, song.title].filter((s) => s).join(' - '));
      } else {
        setTextAndReticker('val-title', song.title);
      }
      setTextAndReticker('val-artist', song.artist);
      setTextAndReticker('val-tuning', abbreviateTuning(song.tuning));
      setTextAndReticker('val-path', song.path);
      setTextAndReticker('val-year', song.year);
      setTextAndReticker('val-album', song.album);
      if (song.artUrl && song.artUrl !== lastArtUrl) {
        lastArtUrl = song.artUrl;
        artImg.classList.remove('loaded');
        artImg.onload = () => artImg.classList.add('loaded');
        artImg.onerror = () => artImg.classList.remove('loaded');
        artImg.src = song.artUrl;
